# SV08 MAX filament buffer — PUSHED variant (fallback, faithful to stock behavior)
# Event-driven: push switch fires a discrete 25mm MANUAL_STEPPER move, like Sovol's
# buffer_stepper.py, but with zero custom klippy code. Include EXACTLY ONE of
# buffer-synced.cfg / buffer-pushed.cfg.
#
# Bench-validate: a MANUAL_STEPPER move mid-print must not stutter XY. Includes the
# stock NOZZLE_CLOG_CHECK heuristic (extrusion without pushes = clog/grind).

[mcu buffer_mcu]                       # feeder STM32F103, CAN @ 1M
canbus_uuid: 4ff8d1a962f9

[manual_stepper filament_buffer]
step_pin: buffer_mcu: PA8
dir_pin: buffer_mcu: PA9
enable_pin: !buffer_mcu: PA11
microsteps: 16
rotation_distance: 9.75
full_steps_per_rotation: 200
velocity: 150
accel: 5000

[tmc2209 manual_stepper filament_buffer]
uart_pin: buffer_mcu: PA12
interpolate: True
run_current: 0.9
hold_current: 0.4
sense_resistor: 0.150
uart_address: 3

# Push switch: slack gone -> feed 25mm; arm jam re-check for after the move
[gcode_button buffer_push]
pin: ^buffer_mcu: PB11
press_gcode:
    {% if printer["gcode_macro _global_var"].is_push_buffer and printer["filament_switch_sensor filament_sensor"].filament_detected %}
        MANUAL_STEPPER STEPPER=filament_buffer ENABLE=1
        MANUAL_STEPPER STEPPER=filament_buffer SET_POSITION=0 MOVE=25 SPEED=150 ACCEL=5000
        {% if printer.print_stats.state == "printing" %}
            NOZZLE_CLOG_CHECK
        {% endif %}
        UPDATE_DELAYED_GCODE ID=buffer_jam_check DURATION=0.6
    {% endif %}
release_gcode:
    UPDATE_DELAYED_GCODE ID=buffer_jam_check DURATION=0

# Jam = switch still pressed ~0.6s after a push completed (filament didn't move).
# Timing mirrors Sovol 2.1.9, which tightened the module's event_delay 2.0 -> 0.1
# (push move takes ~0.35s; 0.6 = move + 0.1 + margin).
[delayed_gcode buffer_jam_check]
gcode:
    {% if printer["gcode_button buffer_push"].state == "PRESSED" and printer.print_stats.state == "printing" and printer["filament_switch_sensor filament_sensor"].filament_detected %}
        SET_PIN PIN=green_led VALUE=0
        SET_PIN PIN=blue_led VALUE=1
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=winding_status VALUE=True
        PAUSE
        {action_respond_info("Filament jam detected! Push switch still triggered after move.")}
    {% endif %}

[filament_switch_sensor filament_sensor]   # buffer inlet — name is a contract, keep it
pause_on_runout: False
switch_pin: ^buffer_mcu: PA10
insert_gcode:
    SET_PIN PIN=green_led VALUE=1.00
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
runout_gcode:
    SET_PIN PIN=green_led VALUE=0.00
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
    CONTINUE_PRINT_D D=1100
    {action_respond_info("filament exhausted!")}

[output_pin red_led]
pin: !buffer_mcu: PC14
value: 0

[output_pin blue_led]
pin: !buffer_mcu: PC15
value: 0

[output_pin green_led]
pin: !buffer_mcu:PB1
value: 0

[gcode_button manual_push]
pin: buffer_mcu: PA1
press_gcode:
release_gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected and printer["print_stats"].state != "printing" and printer["gcode_button stall_push_stop"].state != "PRESSED" %}
        {% if printer["gcode_macro variables"].is_manual_feeding %}
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
            UPDATE_DELAYED_GCODE ID=feed_loop DURATION=0
            # motor stays enabled on stop (Sovol 2.1.9 fix: holding torque
            # prevents filament slipping back; stall_push_stop still disables)
        {% else %}
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=False
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=True
            MANUAL_STEPPER STEPPER=filament_buffer ENABLE=1
            FEED_LOOP
        {% endif %}
    {% endif %}

[gcode_button stall_push_stop]
pin: ^buffer_mcu: PB10
press_gcode:
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
    MANUAL_STEPPER STEPPER=filament_buffer ENABLE=0
release_gcode:

[gcode_macro FEED_LOOP]
gcode:
  {% if printer["gcode_macro variables"].stop_feeding|default(False) %}
    { action_respond_info("stop push filament") }
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=False
  {% else %}
    MANUAL_STEPPER STEPPER=filament_buffer SET_POSITION=0 MOVE=2 SPEED=33
    UPDATE_DELAYED_GCODE ID=feed_loop DURATION=0.06
  {% endif %}

[delayed_gcode feed_loop]
gcode:
  FEED_LOOP

[gcode_macro MANUAL_FEED]
gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected and printer["gcode_button buffer_push"].state == "PRESSED" %}
        MANUAL_STEPPER STEPPER=filament_buffer ENABLE=1
        MANUAL_STEPPER STEPPER=filament_buffer SET_POSITION=0 MOVE=25 SPEED=100
    {% endif %}

[gcode_macro NOZZLE_CLOG_CHECK]
variable_extrusion_start: 0
variable_time_start: 0
gcode:
    {% set extrusion_start = printer.print_stats.filament_used|int %}
    {% set time_start = printer.print_stats.print_duration|int %}
    SET_GCODE_VARIABLE MACRO=NOZZLE_CLOG_CHECK VARIABLE=extrusion_start VALUE={extrusion_start}
    SET_GCODE_VARIABLE MACRO=NOZZLE_CLOG_CHECK VARIABLE=time_start VALUE={time_start}
    {% if time_start > 0 %}
        UPDATE_DELAYED_GCODE ID=CHECK_NOZZLE_CLOG DURATION=1
    {% endif %}

[delayed_gcode CHECK_NOZZLE_CLOG]
gcode:
    {% set current_extrusion = printer.print_stats.filament_used|int %}
    {% set extrusion_start = printer["gcode_macro NOZZLE_CLOG_CHECK"].extrusion_start|int %}
    {% set delta_extrusion = current_extrusion - extrusion_start %}
    {% if delta_extrusion > 50 and not printer["gcode_macro variables"].clog_retry %}
        {% if printer["print_stats"].state == "printing" and printer["filament_switch_sensor filament_sensor"].filament_detected and printer["gcode_macro variables"].is_manual_feeding != True %}
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=clog_retry VALUE=True
            UPDATE_DELAYED_GCODE ID=CHECK_NOZZLE_CLOG DURATION=5
        {% else %}
            UPDATE_DELAYED_GCODE ID=CHECK_NOZZLE_CLOG DURATION=0
        {% endif %}
    {% elif delta_extrusion > 50 and printer["gcode_macro variables"].clog_retry%}
        SET_PIN PIN=green_led VALUE=0
        SET_PIN PIN=red_led VALUE=1
        PAUSE
        { action_respond_info("Nozzle clog detected! Extruded only: " ~ delta_extrusion) }
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=plug_status VALUE=True
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=clog_retry VALUE=False
        UPDATE_DELAYED_GCODE ID=CHECK_NOZZLE_CLOG DURATION=0
    {% else %}
        {% if printer["print_stats"].state == "printing" and printer["filament_switch_sensor filament_sensor"].filament_detected and printer["gcode_macro variables"].is_manual_feeding != True %}
            UPDATE_DELAYED_GCODE ID=CHECK_NOZZLE_CLOG DURATION=1
        {% else %}
            UPDATE_DELAYED_GCODE ID=CHECK_NOZZLE_CLOG DURATION=0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=plug_status VALUE=False
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=clog_retry VALUE=False
    {% endif %}

[gcode_macro CHECK_FILAMENT_STATUS]
gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
        SET_PIN PIN=green_led VALUE=1
    {% else %}
        SET_PIN PIN=green_led VALUE=0
    {% endif %}
    SET_PIN PIN=red_led VALUE=0
    SET_PIN PIN=blue_led VALUE=0

[delayed_gcode INITIAL_FILAMENT_CHECK]
gcode:
    CHECK_FILAMENT_STATUS
initial_duration: 1

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp = printer.extruder.target|int %}
    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" or current_target_temp == 0 %}
            M109 S{extruder_temp}
        {% elif current_target_temp >= printer.configfile.settings['extruder'].min_extrude_temp %}
            M109 S{current_target_temp}
        {% else %}
            M109 S{extruder_temp}
        {% endif %}
        G91
        G1 E+30 F300
        M400
        SET_GCODE_VARIABLE MACRO=_global_var VARIABLE=is_push_buffer VALUE=False
        MANUAL_STEPPER STEPPER=filament_buffer ENABLE=1
        G1 E-10 F1500
        MANUAL_STEPPER STEPPER=filament_buffer SET_POSITION=0 MOVE=-10 SPEED=25
        G1 E-35 F600
        MANUAL_STEPPER STEPPER=filament_buffer SET_POSITION=0 MOVE=-35 SPEED=10
        G1 E5 F600
        MANUAL_STEPPER STEPPER=filament_buffer SET_POSITION=0 MOVE=5 SPEED=10
        G1 E-5 F600
        MANUAL_STEPPER STEPPER=filament_buffer SET_POSITION=0 MOVE=-5 SPEED=10
        M109 S160
        G1 E10 F300
        MANUAL_STEPPER STEPPER=filament_buffer SET_POSITION=0 MOVE=10 SPEED=5
        G1 E-10 F300
        MANUAL_STEPPER STEPPER=filament_buffer SET_POSITION=0 MOVE=-10 SPEED=5
        G4 P3000
        M400
        G1 E-50 F300
        MANUAL_STEPPER STEPPER=filament_buffer SET_POSITION=0 MOVE=-100 SPEED=5
        G4 P4000
        M400
        G90
        {% if current_target_temp == 0 or printer.print_stats.state != "paused" %}
            M104 S0
        {% endif %}
        M109 S{current_target_temp}
        SET_GCODE_VARIABLE MACRO=_global_var VARIABLE=is_push_buffer VALUE=True
    {% else %}
        {action_respond_info("Don't unload filament during printing!!!")}
    {% endif %}

[gcode_macro BUFFER_LONG_UNLOAD_FILAMENT]
gcode:
    UNLOAD_FILAMENT
    MANUAL_STEPPER STEPPER=filament_buffer SET_POSITION=0 MOVE=-100 SPEED=10
    MANUAL_STEPPER STEPPER=filament_buffer SET_POSITION=0 MOVE=-1000 SPEED=50
    MANUAL_STEPPER STEPPER=filament_buffer SET_POSITION=0 MOVE=-1000 SPEED=50
    # feeder ejection runs on its own timeline; hold the gcode stream until the
    # ~40s tail spit-out physically completes (mirrors Sovol 2.1.9)
    M400
    G4 P50000
