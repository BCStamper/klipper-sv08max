# SV08 MAX power-loss recovery — mainline port, zero core patches
# Journal: delayed_gcode saves {file byte offset, Z, XY, temps, fan} to
# save_variables every 5s while printing. Resume: plr.sh regenerates a trimmed
# gcode file seeking by byte offset (more robust than stock's text-match seek).
# Slicer contract: start gcode calls PRINT_START, end gcode calls PRINT_END.

[gcode_shell_command plr_regen]
command: sh /home/sovol/printer_data/config/plr.sh
timeout: 420.

[gcode_shell_command plr_clear]
command: sh -c "rm -f /home/sovol/printer_data/gcodes/plr/*"
timeout: 5.

[gcode_macro PRINT_START]
gcode:
    save_last_file
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=True
    {% if printer["gcode_macro BUFFER_SYNC"] is defined %}
        BUFFER_SYNC
    {% endif %}
    UPDATE_DELAYED_GCODE ID=plr_journal DURATION=5

[gcode_macro PRINT_END]
gcode:
    UPDATE_DELAYED_GCODE ID=plr_journal DURATION=0
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
    {% if printer["gcode_macro BUFFER_DESYNC"] is defined %}
        BUFFER_DESYNC
    {% endif %}
    RUN_SHELL_COMMAND CMD=plr_clear
    clear_last_file

[gcode_macro save_last_file]
gcode:
    {% set filepath = printer.virtual_sdcard.file_path %}
    {% set filename = filepath.split('/') %}
    SAVE_VARIABLE VARIABLE=last_file VALUE='"{ filename[-1] }"'
    SAVE_VARIABLE VARIABLE=filepath VALUE='"{ printer.virtual_sdcard.file_path }"'

[gcode_macro clear_last_file]
gcode:
    SAVE_VARIABLE VARIABLE=last_file VALUE='"default"'
    SAVE_VARIABLE VARIABLE=filepath VALUE='"default"'

# Journal tick — one space-free dict literal per save keeps this a single
# SAVE_VARIABLE (one file write per tick)
[delayed_gcode plr_journal]
gcode:
    {% if printer.print_stats.state == "printing" and printer.virtual_sdcard.is_active %}
        # part-cooling fan speed: [fan] on the new toolhead, fan_generic fan0 on stock
        {% set fanspeed = printer.fan.speed if 'fan' in printer else (printer['fan_generic fan0'].speed if 'fan_generic fan0' in printer else 0) %}
        {% set st = "{'fp':%d,'z':%.3f,'x':%.2f,'y':%.2f,'etemp':%d,'btemp':%d,'fan':%d}" % (printer.virtual_sdcard.file_position, printer.gcode_move.gcode_position.z, printer.gcode_move.gcode_position.x, printer.gcode_move.gcode_position.y, printer.extruder.target, printer.heater_bed.target, fanspeed * 255) %}
        SAVE_VARIABLE VARIABLE=plr_state VALUE={st}
        UPDATE_DELAYED_GCODE ID=plr_journal DURATION=5
    {% endif %}

# Boot check: offer resume via Mainsail/Fluidd prompt dialog
[delayed_gcode plr_boot_check]
initial_duration: 6
gcode:
    {% if printer.save_variables.variables.was_interrupted|default(False) and printer.save_variables.variables.last_file|default('default') != 'default' %}
        RESPOND TYPE=command MSG="action:prompt_begin Interrupted print detected"
        RESPOND TYPE=command MSG="action:prompt_text Resume '{printer.save_variables.variables.last_file}' from the journaled position?"
        RESPOND TYPE=command MSG="action:prompt_footer_button Resume|RESUME_INTERRUPTED|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Discard|G31|secondary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro RESUME_INTERRUPTED]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set last_file = printer.save_variables.variables.last_file|string %}
    RUN_SHELL_COMMAND CMD=plr_regen
    SDCARD_PRINT_FILE FILENAME="plr/{last_file}"

[gcode_macro G31]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    RUN_SHELL_COMMAND CMD=plr_clear
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
