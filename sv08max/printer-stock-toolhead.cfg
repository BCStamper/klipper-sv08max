########################################
# Fans — stock layout (two part-cooling fans on the toolhead)
########################################

[fan_generic fan0]                     # front part-cooling
pin: extra_mcu:PB0
max_power: 1.0

[fan_generic fan1]                     # back part-cooling
pin: extra_mcu:PA7
max_power: 1.0

[fan_generic fan2]                     # auxiliary (mainboard)
pin: PB0
max_power: 1.0

[fan_generic fan3]                     # exhaust (mainboard)
pin: PE11
max_power: 1.0

[heater_fan hotend_fan]
pin: extra_mcu:PA6
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 45
tachometer_pin: extra_mcu:PA1
tachometer_ppr: 1
tachometer_poll_interval: 0.0013

[heater_fan bed_fan]
pin: PE14
max_power: 1.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 35
tachometer_pin: PB10
tachometer_ppr: 2
tachometer_poll_interval: 0.001375

# Stock M106/M107 semantics: default index drives BOTH part-cooling fans
[gcode_macro M106]
gcode:
    {% set fan = 'fan' + (params.P|int if params.P is defined else 0)|string %}
    {% set speed = (params.S|float / 255 if params.S is defined else 1.0) %}
    {% if fan == 'fan0' or fan == 'fan1' %}
        SET_FAN_SPEED FAN=fan0 SPEED={speed}
        SET_FAN_SPEED FAN=fan1 SPEED={speed}
    {% else %}
        SET_FAN_SPEED FAN={fan} SPEED={speed}
    {% endif %}

[gcode_macro M107]
gcode:
    {% set fan = 'fan' + (params.P|int if params.P is defined else 0)|string %}
    {% if fan == 'fan0' or fan == 'fan1' %}
        SET_FAN_SPEED FAN=fan0 SPEED=0
        SET_FAN_SPEED FAN=fan1 SPEED=0
    {% else %}
        SET_FAN_SPEED FAN={fan} SPEED=0
    {% endif %}

