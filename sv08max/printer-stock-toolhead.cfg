resistance1: 100000
temperature2: 50
resistance2: 18085.4
temperature3: 100
resistance3: 5362.6

[heater_bed]
heater_pin: PD12
sensor_type: bed_thermistor
sensor_pin: PC5
max_power: 1.0
min_temp: 0
max_temp: 110
control: pid
pid_Kp: 73.571
pid_Ki: 1.820
pid_Kd: 783.849

########################################
# Probe — mainline probe_eddy_current on the STOCK Sovol coil
# SWITCHED 2026-07-26: eddy-ng's start_probe_session() unconditionally routes
# through its scan-only session, which requires Z already homed -> circular
# "Z axis must be homed before probing" on G28 Z. Confirmed via direct source
# read (probe_eddy_ng.py) to be a real upstream bug, not our config; matches
# vvuk/eddy-ng issue #146 (open, unresolved as of this date). Verified neither
# origin/main nor origin/eng-work fixes it. No tap until this is resolved --
# acceptable per user: manually recalibrate every 5-10kg of CF instead.
# z_offset/x_offset/y_offset below are Sovol's original factory values for
# this exact coil+mount. Software i2c (PB10/PB11) kept -- it's a Klipper-core
# bus.py capability, not eddy-ng-specific, so the F103 i2c-errata workaround
# still applies here.
########################################

#[probe_eddy_ng eddy]                  # revive once vvuk/eddy-ng#146 is fixed
#sensor_type: ldc1612
#i2c_mcu: extra_mcu
#i2c_software_scl_pin: extra_mcu:PB10
#i2c_software_sda_pin: extra_mcu:PB11
#x_offset: -19.8
#y_offset: -0.75
#probe_speed: 5.0
#lift_speed: 10.0
#move_speed: 50.0
#home_trigger_height: 2.0
#calibration_z_max: 5.0
#reg_drive_current: 16
#tap_drive_current: 0
#tap_start_z: 3.0
#tap_target_z: -0.350
#tap_mode: butter
#tap_threshold: 250
#tap_speed: 3.0
#tap_adjust_z: 0.000
#tap_samples: 3
#tap_max_samples: 8
#tap_samples_stddev: 0.025

# Rewritten 2026-08-19 to DKEU's own mainline-specific block (from their
# "Mainline Your Max" doc), replacing the stock/Sovol-oriented version this
# started as. The critical fix: max_sensor_hz was never set, silently
# defaulting to 5MHz in ldc1612.py -- our own calibration curve's peak
# frequency (closest to the bed) is 5,950,945 Hz, already past that default.
# Klipper was logging "Should set 'max_sensor_hz' to at least 5950945" on
# every single restart tonight (confirmed in klippy.log, 4+ occurrences) --
# missed for hours because it's a runtime_warning, not one of the
# error/traceback patterns this session's log greps were filtering for.
# With max_sensor_hz too low, the sensor's own frequency divider and
# conversion math (sensor_div, freq_conv in ldc1612.py) would be computed
# wrong specifically in the near-bed range where readings exceed it -- a
# strong candidate for explaining the whole night's "not in valid range" /
# "already triggered" errors, including the one at Z=3.000 (confirmed via
# diagnostic RESPOND, well within the calibrated 0.05-4.05mm range) that
# ruled out every earlier "height beyond calibration range" theory.
# z_offset renamed to descend_z (current mainline name; z_offset still
# works via Klipper's own deprecation shim, but matching DKEU's exact
# recommended config rather than relying on that).
[probe_eddy_current eddy]
sensor_type: ldc1612
max_sensor_hz: 6031173
# LOCAL PATCH (klipper-sv08max, 2026-08-19): lowered from 3.50 -- descend_z
# isn't just a physical offset, it's the actual home-mode trigger height
# (confirmed in probe_eddy_current.py: trigger_freq =
# self._calibration.height_to_freq(self._descend_z)). A bare PROBE command
# (no METHOD=) defaults to "automatic", which resolves to the descend
# session -- confirmed in probe_eddy_current.py's start_probe_session().
# z_park (3mm, this project's own fix for the scan-mode "sensor not in
# valid range" bugs found earlier tonight) was BELOW this 3.50mm trigger
# height, so any bare PROBE call starting from z_park (e.g. BED_CHECKER's
# _BC_MOVE/_BC_PROBE) found the sensor already reading triggered before it
# ever moved -- zero travel before trigger, exactly matching homing.py's
# check_no_movement() condition for "Probe triggered prior to movement".
# Lowering this to 2.0 gives clearance on both sides: comfortably below
# z_park (3mm) so descend-mode probes have room to travel, and comfortably
# below the calibrated ceiling (4.05mm) so scan-mode reads stay valid. Also
# affects real G28 Z homing (same trigger height, same parameter) -- flagged
# to Ben before applying since it changes where the machine considers
# itself homed relative to the bed, not just a bed_checker implementation
# detail.
descend_z: 2.0
i2c_mcu: extra_mcu
i2c_software_scl_pin: extra_mcu:PB10
i2c_software_sda_pin: extra_mcu:PB11
x_offset: -19.8
y_offset: -0.75

speed: 5
# samples: 3              #<<<< Uncomment to increase probed samples
# samples_result: median  #<<<< Uncomment to use middle value sample
sample_retract_dist: 5.0
samples_tolerance: 0.0095
samples_tolerance_retries: 10

# tap_threshold:          #<<<< Uncomment to add custom tap threshold value
# tap_z_offset: 0.0       #<<<< Uncomment to adjust tap_z offset if needed

#[safe_z_home]
#home_xy_position: 269.8, 250.75        # bed center 250,250 minus coil offsets
                                       # (-19.8,-0.75) => coil over center for Z home
#z_hop: 10
#z_hop_speed: 10

[bed_mesh]
speed: 400
horizontal_move_z: 2
algorithm: bicubic
mesh_min: 13,15                        # stock bounds — already correct for stock coil offsets
mesh_max: 476,490
probe_count: 60,60
fade_start: 0
fade_end: 10
scan_overshoot: 4

[quad_gantry_level]
gantry_corners:
	-70,-40
	550,600
points:
    50, 30
    50, 470
    490, 470
    490, 30
speed: 400
horizontal_move_z: 3
retry_tolerance: 0.1
retries: 15
max_adjust: 20

########################################
# Accelerometer — stock toolhead LIS2DW
########################################

[lis2dw]
cs_pin: extra_mcu:PB12
spi_software_sclk_pin: extra_mcu:PB13
spi_software_mosi_pin: extra_mcu:PB15
spi_software_miso_pin: extra_mcu:PB14
axes_map: x,z,y

[resonance_tester]
accel_chip: lis2dw
probe_points:
    250, 250, 30

########################################
# Misc
########################################

[output_pin main_led]
pin: PD13
value: 1.0

[temperature_sensor mainboard_mcu]
sensor_type: temperature_mcu

[temperature_sensor host]
sensor_type: temperature_host
[include moonraker_obico_macros.cfg]

