# Sovol SV08 MAX — MAINLINE Klipper, STOCK TOOLHEAD (Stage 1 / permanent fallback)
#
# Purpose: run mainline (this fork) with the factory toolhead still mounted —
# the Stage 1 cutover config, and the forever-fallback if the stock toolhead
# ever goes back on. SELF-CONTAINED BY DESIGN: duplicates the mainboard sections
# of printer.cfg deliberately, so restoring it is one copy:
#     cp printer-stock-toolhead.cfg printer.cfg
#
# Probe: eddy-ng on the STOCK Sovol coil (software i2c dodges the F103 hardware
# i2c errata). Block adapted from 3DPrintDemon's tested MAX config.
# ⚠ Firmware note: the toolhead F103 firmware MUST be built from a Klipper tree
# with eddy-ng installed (it adds MCU-side sensor code). Install eddy-ng BEFORE
# building any MCU binaries.
#
# TODOs: only the CAN UUIDs (re-query after flashing — mainline uses real chip IDs).

[include buffer-synced.cfg]            # or buffer-pushed.cfg — include exactly one
#[include buffer-pushed.cfg]
[include plr.cfg]
[include macros.cfg]

########################################
# MCUs
########################################

[mcu]                                  # mainboard STM32H750, USB-to-CAN bridge
canbus_uuid: TODO_MAINBOARD_UUID

[mcu extra_mcu]                        # STOCK toolhead STM32F103 (CAN)
canbus_uuid: TODO_STOCK_TOOLHEAD_UUID

# [mcu buffer_mcu] lives in the buffer variant file

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 20000                       # stock ran 40000 with Sovol's inflated buffers;
                                       # start at 20k on mainline, raise after shakedown
minimum_cruise_ratio: 0.25             # matches Sovol 2.1.9 live tuning
max_z_velocity: 10
max_z_accel: 500
square_corner_velocity: 5.0

[force_move]
enable_force_move: True

[idle_timeout]
timeout: 1800

[pause_resume]
[display_status]
[respond]
[exclude_object]

[gcode_arcs]
resolution: 1.0

[virtual_sdcard]
path: /home/sovol/printer_data/gcodes

[save_variables]
filename: /home/sovol/printer_data/config/saved_variables.cfg

########################################
# X/Y steppers (stock geometry — known-good values)
########################################

[stepper_x]
step_pin: PE1
dir_pin: PD7
enable_pin: !PD5
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^extra_mcu:PA10           # STOCK X endstop on the factory toolhead
position_min: -11
position_endstop: -11
position_max: 502
homing_speed: 120
homing_retract_dist: 3
homing_retract_speed: 15.0

[tmc5160 stepper_x]
cs_pin: PE0
spi_software_mosi_pin: PB6
spi_software_miso_pin: PB5
spi_software_sclk_pin: PB4
interpolate: false
run_current: 3.0
sense_resistor: 0.05
stealthchop_threshold: 0

[stepper_y]
step_pin: PD3
dir_pin: PD2
enable_pin: !PD0
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^PD1
position_min: -1
position_endstop: 505
position_max: 505
homing_speed: 120
homing_retract_dist: 3
homing_retract_speed: 15.0

[tmc5160 stepper_y]
cs_pin: PD4
spi_software_mosi_pin: PB6
spi_software_miso_pin: PB5
spi_software_sclk_pin: PB4
interpolate: false
run_current: 3.0
sense_resistor: 0.05
stealthchop_threshold: 0

########################################
# Z steppers x4 (mainboard, stock)
########################################

[stepper_z]   # z1 front-left
step_pin: PA8
dir_pin: PC9
enable_pin: !PA10
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 505
position_min: -10
homing_speed: 10.0
homing_retract_dist: 5.0
homing_retract_speed: 10.0
second_homing_speed: 5.0

[tmc2209 stepper_z]
uart_pin: PA9
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

[stepper_z1]  # z2
step_pin: PC6
dir_pin: !PD15
enable_pin: !PC8
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

[stepper_z2]  # z3
step_pin: PA5
dir_pin: PA4
enable_pin: !PA7
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PA6
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

[stepper_z3]  # z4
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB15
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PB14
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

########################################
# Extruder — STOCK toolhead (F103)
########################################

[adc_temperature extruder_thermistor]  # stock custom NTC linearization
temperature1: 25
resistance1: 1268.60
temperature2: 180
resistance2: 1920.98
temperature3: 300
resistance3: 2398.52

[extruder]
step_pin: extra_mcu:PA8
dir_pin: extra_mcu:PA9
enable_pin: !extra_mcu:PA11
rotation_distance: 6.5
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 150
max_extrude_cross_section: 5
heater_pin: extra_mcu:PB7
sensor_type: extruder_thermistor
pullup_resistor: 11500
sensor_pin: extra_mcu:PA5
min_temp: 0
max_temp: 310
min_extrude_temp: 150
control: pid                           # stock values — good starting point
pid_Kp: 34.838
pid_Ki: 4.976
pid_Kd: 62.823
pressure_advance: 0.025
pressure_advance_smooth_time: 0.035

[tmc2209 extruder]
uart_pin: extra_mcu:PA12
interpolate: True
run_current: 0.8
uart_address: 3
sense_resistor: 0.150

########################################
# Fans — stock layout (two part-cooling fans on the toolhead)
########################################

[fan_generic fan0]                     # front part-cooling
pin: extra_mcu:PB0
max_power: 1.0

[fan_generic fan1]                     # back part-cooling
pin: extra_mcu:PA7
max_power: 1.0

[fan_generic fan2]                     # auxiliary (mainboard)
pin: PB0
max_power: 1.0

[fan_generic fan3]                     # exhaust (mainboard)
pin: PE11
max_power: 1.0

[heater_fan hotend_fan]
pin: extra_mcu:PA6
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 45
tachometer_pin: extra_mcu:PA1
tachometer_ppr: 1
tachometer_poll_interval: 0.0013

[heater_fan bed_fan]
pin: PE14
max_power: 1.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 35
tachometer_pin: PB10
tachometer_ppr: 2
tachometer_poll_interval: 0.001375

# Stock M106/M107 semantics: default index drives BOTH part-cooling fans
[gcode_macro M106]
gcode:
    {% set fan = 'fan' + (params.P|int if params.P is defined else 0)|string %}
    {% set speed = (params.S|float / 255 if params.S is defined else 1.0) %}
    {% if fan == 'fan0' or fan == 'fan1' %}
        SET_FAN_SPEED FAN=fan0 SPEED={speed}
        SET_FAN_SPEED FAN=fan1 SPEED={speed}
    {% else %}
        SET_FAN_SPEED FAN={fan} SPEED={speed}
    {% endif %}

[gcode_macro M107]
gcode:
    {% set fan = 'fan' + (params.P|int if params.P is defined else 0)|string %}
    {% if fan == 'fan0' or fan == 'fan1' %}
        SET_FAN_SPEED FAN=fan0 SPEED=0
        SET_FAN_SPEED FAN=fan1 SPEED=0
    {% else %}
        SET_FAN_SPEED FAN={fan} SPEED=0
    {% endif %}

########################################
# Bed (mainboard, stock)
########################################

[thermistor bed_thermistor]
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 18085.4
temperature3: 100
resistance3: 5362.6

[heater_bed]
heater_pin: PD12
sensor_type: bed_thermistor
sensor_pin: PC5
max_power: 1.0
min_temp: 0
max_temp: 110
control: pid
pid_Kp: 73.571
pid_Ki: 1.820
pid_Kd: 783.849

########################################
# Probe — eddy-ng on the STOCK Sovol coil
# (block adapted from 3DPrintDemon's tested SV08 MAX mainline config;
#  software i2c on PB10/PB11 dodges the F103 hardware-i2c errata)
########################################

[probe_eddy_ng eddy]
sensor_type: ldc1612
i2c_mcu: extra_mcu
i2c_software_scl_pin: extra_mcu:PB10
i2c_software_sda_pin: extra_mcu:PB11
x_offset: -19.8
y_offset: -0.75
probe_speed: 5.0
lift_speed: 10.0
move_speed: 50.0
home_trigger_height: 2.0
calibration_z_max: 5.0
reg_drive_current: 15
tap_drive_current: 0
tap_start_z: 3.0
tap_target_z: -0.350
tap_mode: butter
tap_threshold: 250
tap_speed: 3.0
tap_adjust_z: 0.000
tap_samples: 3
tap_max_samples: 8
tap_samples_stddev: 0.025

[safe_z_home]
home_xy_position: 269.8, 250.75        # bed center 250,250 minus coil offsets
                                       # (-19.8,-0.75) => coil over center for Z home
z_hop: 10
z_hop_speed: 10

[bed_mesh]
speed: 400
horizontal_move_z: 2
algorithm: bicubic
mesh_min: 13,15                        # stock bounds — already correct for stock coil offsets
mesh_max: 476,490
probe_count: 60,60
fade_start: 0
fade_end: 10
scan_overshoot: 4

[quad_gantry_level]
gantry_corners:
	-70,-40
	550,600
points:
    50, 30
    50, 470
    490, 470
    490, 30
speed: 400
horizontal_move_z: 15
retry_tolerance: 0.1
retries: 15
max_adjust: 20

########################################
# Accelerometer — stock toolhead LIS2DW
########################################

[lis2dw]
cs_pin: extra_mcu:PB12
spi_software_sclk_pin: extra_mcu:PB13
spi_software_mosi_pin: extra_mcu:PB15
spi_software_miso_pin: extra_mcu:PB14
axes_map: x,z,y

[resonance_tester]
accel_chip: lis2dw
probe_points:
    250, 250, 30

########################################
# Misc
########################################

[output_pin main_led]
pin: PD13
value: 1.0

[temperature_sensor mainboard_mcu]
sensor_type: temperature_mcu

[temperature_sensor host]
sensor_type: temperature_host
