# Sovol SV08 MAX — MAINLINE Klipper, STOCK TOOLHEAD (Stage 1 / permanent fallback)
#
# Purpose: run mainline (this fork) with the factory toolhead still mounted —
# the Stage 1 cutover config, and the forever-fallback if the stock toolhead
# ever goes back on. SELF-CONTAINED BY DESIGN: duplicates the mainboard sections
# of printer.cfg deliberately, so restoring it is one copy:
#     cp printer-stock-toolhead.cfg printer.cfg
#
# Probe: eddy-ng on the STOCK Sovol coil (software i2c dodges the F103 hardware
# i2c errata). Block adapted from 3DPrintDemon's tested MAX config.
# ⚠ Firmware note: the toolhead F103 firmware MUST be built from a Klipper tree
# with eddy-ng installed (it adds MCU-side sensor code). Install eddy-ng BEFORE
# building any MCU binaries.
#
# TODOs: only the CAN UUIDs (re-query after flashing — mainline uses real chip IDs).

# Buffer disabled 2026-08-19: junction-velocity/non-kinematic-move problem in
# Klipper's lookahead planner (see project notes) makes the Sovol buffer
# unfixable via config on mainline. Shelved per plan -- clean DKEU baseline
# first, revisit buffer later only via genuine custom Klipper source if at all.
#[include buffer-synced.cfg]            # or buffer-pushed.cfg — include exactly one
#[include buffer-pushed.cfg]
[include plr.cfg]
# macros.cfg disabled 2026-08-19: dropping our custom macro layer (park coords,
# feeder-aware PAUSE/RESUME/CANCEL, buffer-aware LOAD/UNLOAD) for a clean DKEU
# baseline ahead of the v3.2.2 reinstall. DKEU's own defaults take over.
#[include macros.cfg]
[include ./Demon_Klipper_Essentials_Unified/*.cfg]
[include ./Demon_User_Files/*.cfg]
[include ./Demon_Klipper_Essentials_Unified/Other_Files/Demon_User_Files_Updater/Demon_User_Files_Handler_v*.cfg]
[include ./KAMP_LiTE/*.cfg]
[include ./Heat_Soak.cfg]
[include ./mainsail.cfg]
# _CLIENT_VARIABLE override, added 2026-08-19 per DKEU's Set_Up_Your_Mainsail.cfg.md --
# wires client.cfg's PAUSE/RESUME/CANCEL_PRINT (active since mainsail.cfg loads
# after DKEU's core) to actually call _DEMON_PAUSE/_DEMON_RESUME/_DEMON_CANCEL.
# Without this they silently no-op (client.cfg defaults all three hooks to "").
[include ./My_Macros.cfg]
########################################
# MCUs
########################################

[mcu]                                  # mainboard STM32H750, USB-to-CAN bridge
canbus_uuid: b785e8392e4b

[mcu extra_mcu]                        # STOCK toolhead STM32F103 (CAN)
canbus_uuid: 9e11addceff3

# [mcu buffer_mcu] lives in the buffer variant file

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 20000                       # stock ran 40000 with Sovol's inflated buffers;
                                       # start at 20k on mainline, raise after shakedown
minimum_cruise_ratio: 0.25             # matches Sovol 2.1.9 live tuning
max_z_velocity: 10
max_z_accel: 500
square_corner_velocity: 5.0

[force_move]
enable_force_move: True

[idle_timeout]
gcode:
    _DEMON_IDLE_TIMEOUT
timeout: 3600

# Added 2026-08-19, DKEU post-install checklist -- retract/unretract for
# firmware-based retraction, paired with My_Macros.cfg's use_fw_retract:True.
# Values are DKEU's own documented defaults, not yet tuned for this machine.
[firmware_retraction]
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0.0
unretract_speed: 30

[pause_resume]
[display_status]
[respond]
[exclude_object]

[gcode_arcs]
resolution: 1.0

[virtual_sdcard]
path: /home/sovol/printer_data/gcodes

[save_variables]
filename: /home/sovol/printer_data/config/saved_variables.cfg

########################################
# X/Y steppers (stock geometry — known-good values)
########################################

[stepper_x]
step_pin: PE1
dir_pin: PD7
enable_pin: !PD5
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^extra_mcu:PA10           # STOCK X endstop on the factory toolhead
position_min: -11
position_endstop: -11
position_max: 502
homing_speed: 120
homing_retract_dist: 3
homing_retract_speed: 15.0

[tmc5160 stepper_x]
cs_pin: PE0
spi_software_mosi_pin: PB6
spi_software_miso_pin: PB5
spi_software_sclk_pin: PB4
interpolate: false
run_current: 3.0
sense_resistor: 0.05
stealthchop_threshold: 0

[stepper_y]
step_pin: PD3
dir_pin: PD2
enable_pin: !PD0
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^PD1
position_min: -1
position_endstop: 505
position_max: 505
homing_speed: 120
homing_retract_dist: 3
homing_retract_speed: 15.0

[tmc5160 stepper_y]
cs_pin: PD4
spi_software_mosi_pin: PB6
spi_software_miso_pin: PB5
spi_software_sclk_pin: PB4
interpolate: false
run_current: 3.0
sense_resistor: 0.05
stealthchop_threshold: 0

########################################
# Z steppers x4 (mainboard, stock)
########################################

[stepper_z]   # z1 front-left
step_pin: PA8
dir_pin: PC9
enable_pin: !PA10
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 505
# Changed 2026-08-19 per DKEU's SV08 MAX doc explicit warning: stock -10 is
# "crazy" and risks the nozzle being driven through the bed on a homing
# error. -1.5 keeps a small legitimate margin without that risk.
position_min: -1.5
homing_speed: 10.0
homing_retract_dist: 5.0
homing_retract_speed: 10.0
second_homing_speed: 5.0

[tmc2209 stepper_z]
uart_pin: PA9
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

[stepper_z1]  # z2
step_pin: PC6
dir_pin: !PD15
enable_pin: !PC8
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

[stepper_z2]  # z3
step_pin: PA5
dir_pin: PA4
enable_pin: !PA7
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PA6
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

[stepper_z3]  # z4
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB15
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PB14
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

########################################
# Extruder — STOCK toolhead (F103)
########################################

[adc_temperature extruder_thermistor]  # stock custom NTC linearization
temperature1: 25
resistance1: 1268.60
temperature2: 180
resistance2: 1920.98
temperature3: 300
resistance3: 2398.52

[extruder]
step_pin: extra_mcu:PA8
dir_pin: extra_mcu:PA9
enable_pin: !extra_mcu:PA11
rotation_distance: 6.5
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 150
max_extrude_cross_section: 5
heater_pin: extra_mcu:PB7
sensor_type: extruder_thermistor
pullup_resistor: 11500
sensor_pin: extra_mcu:PA5
min_temp: 0
max_temp: 310
min_extrude_temp: 150
