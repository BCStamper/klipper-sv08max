# SV08 MAX filament buffer — discrete-push variant, redesigned 2026-07-27.
# The feeder motor is an [extruder_stepper]. During normal printing it is NOT
# synced to the extruder's motion queue — an earlier version tried that (AFC
# TurtleNeck pattern) and it fought the hardware: this feeder is a spring-
# loaded telescoping slide joint that senses TENSION, not a slack-loop
# follower, specifically designed so the buffer doesn't need to track the
# extruder's small per-move retracts during printing. Syncing during printing
# reintroduced the coupling the mechanism exists to avoid. BUFFER_SYNC/DESYNC
# still exist, deliberately, for UNLOAD_FILAMENT's own large (~65mm) cold-pull
# retraction, which DOES exceed the joint's passive travel — see the note
# above BUFFER_SYNC. Confirmed against Sovol's original
# buffer_stepper.cfg/.py (still on disk, unused, at ~/printer_data/config/
# buffer_stepper.cfg) — this variant now follows that same discrete-push
# shape, just on upstream-maintained primitives (extruder_stepper + FORCE_MOVE)
# instead of the custom module that broke on the motion_queuing rework.
#
# PB11 (buffer_push, "lower" switch): tension pulls the joint down as the
# extruder draws down the staged filament -> triggers a single discrete push.
# PB10 (stall_push_stop, "upper" switch): spring returns the joint up once
# tension is relieved -> in stock, gates the manual feed loop only; here it
# ALSO doubles as clog detection (see buffer_clog_check below).
# Jam (PB11 stuck after a push = upstream, spool-to-buffer) and clog (PB10
# stuck while printing = downstream, buffer-to-nozzle) are separate checks on
# the two switches; filament_switch_sensor below still handles runout.
#
# EVERY FORCE_MOVE call in this file MUST specify ACCEL explicitly. Klipper
# silently defaults it to 0 if omitted (found the hard way, 2026-08-03) --
# and 0 isn't an error, it's treated as "instant, zero-time acceleration",
# which a real stepper physically cannot follow. It just stalls at the start
# of the move with no error anywhere, looking exactly like the motor isn't
# running at all. Confirmed via klippy.log showing the literal command sent
# (accel=0.000) and cross-checked against force_move.py's own calc_move_time.
#
# Include EXACTLY ONE of buffer-synced.cfg / buffer-pushed.cfg.

[mcu buffer_mcu]                       # feeder STM32F103, CAN @ 1M
canbus_uuid: 4ff8d1a962f9

[extruder_stepper filament_buffer]
extruder:                              # not synced at boot; PRINT_START syncs
step_pin: buffer_mcu: PA8
dir_pin: buffer_mcu: PA9
enable_pin: !buffer_mcu: PA11
microsteps: 16
rotation_distance: 9.75
full_steps_per_rotation: 200

[tmc2209 extruder_stepper filament_buffer]
uart_pin: buffer_mcu: PA12
interpolate: True
run_current: 0.9
hold_current: 0.4
sense_resistor: 0.150
uart_address: 3

# BUFFER_SYNC/DESYNC retired from the AUTOMATIC per-print feed path 2026-07-27
# (see header) but kept, simplified, for UNLOAD_FILAMENT's own cold-pull dance:
# that sequence nets ~65mm of extruder-only retraction, almost certainly more
# than the spring joint's mechanical travel can passively absorb (unlike the
# sub-mm retracts during normal printing, which is exactly what the joint IS
# sized for) -- so the buffer needs to actively track the extruder's moves for
# THIS specific maneuver, not passively spring-absorb them. Safe to coexist
# with the discrete-push design: buffer_push's press_gcode only fires while
# printing, UNLOAD_FILAMENT only runs while NOT printing -- mutually exclusive
# print_stats.state gates, so sync and discrete-push can never be active at
# the same time. Dropped the old multiplier_high/low bias here since that was
# specific to the now-retired bang-bang trim -- plain 1:1 tracking is what
# unload actually wants.
[gcode_macro _buffer_vars]
variable_base_rotation_distance: 9.75
variable_synced: False
gcode:

[gcode_macro BUFFER_SYNC]
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=filament_buffer MOTION_QUEUE=extruder
    SET_GCODE_VARIABLE MACRO=_buffer_vars VARIABLE=synced VALUE=True
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=filament_buffer DISTANCE={printer["gcode_macro _buffer_vars"].base_rotation_distance}

[gcode_macro BUFFER_DESYNC]
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=filament_buffer MOTION_QUEUE=
    SET_GCODE_VARIABLE MACRO=_buffer_vars VARIABLE=synced VALUE=False

# Push switch (PB11): fires ONE discrete push per trigger, matching stock's
# do_move shape (push_length=25mm kept from stock; velocity dropped from
# stock's 150mm/s to 60mm/s -- stock's motion was loud and sudden, this is a
# bench-tuning starting point, not a derived value). Jam-check arm delay =
# move duration (25/60 ~= 0.42s) + settle margin, using stock's own
# event_delay convention (2.0s) as that margin -> ~2.5s.
[gcode_button buffer_push]
pin: ^buffer_mcu: PB11
press_gcode:
    {% if printer.print_stats.state == "printing" %}
        FORCE_MOVE STEPPER="extruder_stepper filament_buffer" DISTANCE=25 VELOCITY=60 ACCEL=5000
        UPDATE_DELAYED_GCODE ID=buffer_jam_check DURATION=2.5
    {% endif %}
release_gcode:

# Jam = PB11 still triggered ~2.5s after a push, while printing: the push
# didn't relieve tension, so filament isn't advancing -> upstream of the
# buffer (spool-to-buffer segment) is blocked.
[delayed_gcode buffer_jam_check]
gcode:
    {% if printer["gcode_button buffer_push"].state == "PRESSED" and printer.print_stats.state == "printing" %}
        SET_PIN PIN=green_led VALUE=0
        SET_PIN PIN=blue_led VALUE=1
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=winding_status VALUE=True
        PAUSE
        {action_respond_info("Filament jam detected: buffer starved after push (upstream?)")}
    {% endif %}

[filament_switch_sensor filament_sensor]   # buffer inlet — name is a contract, keep it
pause_on_runout: False
switch_pin: ^buffer_mcu: PA10
insert_gcode:
    SET_PIN PIN=green_led VALUE=1.00
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
runout_gcode:
    SET_PIN PIN=green_led VALUE=0.00
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
    CONTINUE_PRINT_D D=1100
    {action_respond_info("filament exhausted!")}

[output_pin red_led]
pin: !buffer_mcu: PC14
value: 0

[output_pin blue_led]
pin: !buffer_mcu: PC15
value: 0

[output_pin green_led]
pin: !buffer_mcu:PB1
value: 0

# Physical button on feeder: toggle continuous manual feed (FORCE_MOVE based)
[gcode_button manual_push]
pin: buffer_mcu: PA1
press_gcode:
release_gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected and printer["print_stats"].state != "printing" and printer["gcode_button stall_push_stop"].state != "PRESSED" %}
        {% if printer["gcode_macro variables"].is_manual_feeding %}
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
            UPDATE_DELAYED_GCODE ID=feed_loop DURATION=0
        {% else %}
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=False
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=True
            FEED_LOOP
        {% endif %}
    {% endif %}

# PB10 keeps its stock role gating the manual feed loop, and now also arms
# clog detection whenever it triggers during a print (see buffer_clog_check).
[gcode_button stall_push_stop]
pin: ^buffer_mcu: PB10
press_gcode:
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
    {% if printer.print_stats.state == "printing" %}
        UPDATE_DELAYED_GCODE ID=buffer_clog_check DURATION=30
    {% endif %}
release_gcode:

# Clog = PB10 still triggered 30s after it last armed, while printing: the
# joint sprung fully back (buffer topped up, no tension) and nothing has
# demanded more filament since -> downstream (extruder/nozzle) isn't actually
# consuming despite the gcode commanding it. Note: every new press re-arms
# this to +30s, and a press can only happen after an intervening release, so
# this only fires if PB10 has genuinely sat triggered, unbroken, the whole
# window -- a brief release anywhere in there correctly prevents it.
# 30s is a bench-tuning starting point, not derived. Stock's own equivalent
# (NOZZLE_CLOG_CHECK, still on disk unused) watched 50mm of the print's own
# filament_used odometer advancing without a push event, confirmed with a
# second check 5s later before pausing -- a different signal (distance vs.
# switch duration) so not a direct port, but the "detect once, don't act on
# a single blip" philosophy carried over.
[delayed_gcode buffer_clog_check]
gcode:
    {% if printer["gcode_button stall_push_stop"].state == "PRESSED" and printer.print_stats.state == "printing" %}
        SET_PIN PIN=green_led VALUE=0
        SET_PIN PIN=red_led VALUE=1
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=winding_status VALUE=True
        PAUSE
        {action_respond_info("Nozzle clog suspected: buffer fully fed, no downstream demand for 30s")}
    {% endif %}

[gcode_macro FEED_LOOP]
gcode:
  {% if printer["gcode_macro variables"].stop_feeding|default(False) %}
    { action_respond_info("stop push filament") }
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=False
  {% else %}
    FORCE_MOVE STEPPER="extruder_stepper filament_buffer" DISTANCE=2 VELOCITY=33 ACCEL=5000
    UPDATE_DELAYED_GCODE ID=feed_loop DURATION=0.06
  {% endif %}

[delayed_gcode feed_loop]
gcode:
  FEED_LOOP

[gcode_macro MANUAL_FEED]
gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected and printer["gcode_button buffer_push"].state == "PRESSED" %}
        FORCE_MOVE STEPPER="extruder_stepper filament_buffer" DISTANCE=25 VELOCITY=100 ACCEL=5000
    {% endif %}

[gcode_macro CHECK_FILAMENT_STATUS]
gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
        SET_PIN PIN=green_led VALUE=1
    {% else %}
        SET_PIN PIN=green_led VALUE=0
    {% endif %}
    SET_PIN PIN=red_led VALUE=0
    SET_PIN PIN=blue_led VALUE=0

[delayed_gcode INITIAL_FILAMENT_CHECK]
gcode:
    CHECK_FILAMENT_STATUS
initial_duration: 1

# Unload: BUFFER_SYNC tracks the cold-pull dance's ~65mm net retraction (more
# than the spring joint can passively absorb -- see the note above BUFFER_SYNC),
# then BUFFER_DESYNC before the buffer's own FORCE_MOVE pull-back finishes the
# physical separation.
[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp = printer.extruder.target|int %}
    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" or current_target_temp == 0 %}
            M109 S{extruder_temp}
        {% elif current_target_temp >= printer.configfile.settings['extruder'].min_extrude_temp %}
            M109 S{current_target_temp}
        {% else %}
            M109 S{extruder_temp}
        {% endif %}
        BUFFER_SYNC
        G91
        G1 E30 F300
        G1 E-10 F1500
        G1 E-35 F600
        G1 E5 F600
        G1 E-5 F600
        M109 S160
        G1 E10 F300
        G1 E-10 F300
        G4 P3000
        G1 E-50 F300
        G90
        M400
        BUFFER_DESYNC
        FORCE_MOVE STEPPER="extruder_stepper filament_buffer" DISTANCE=-100 VELOCITY=10 ACCEL=5000
        {% if current_target_temp == 0 or printer.print_stats.state != "paused" %}
            M104 S0
        {% endif %}
        M109 S{current_target_temp}
    {% else %}
        {action_respond_info("Don't unload filament during printing!!!")}
    {% endif %}

# Guarded 2026-08-03: previously called UNLOAD_FILAMENT and then unconditionally
# proceeded into the two raw pulls regardless of whether UNLOAD_FILAMENT actually
# did anything (its own print_stats.state guard could no-op it) -- meaning a cold,
# unretracted pull straight off the extruder gear was possible. Also worth knowing:
# PAUSE calls this macro automatically on a filament-change event, not just manual
# testing, so this gap was live on that path too.
[gcode_macro BUFFER_LONG_UNLOAD_FILAMENT]
gcode:
    {% if printer.print_stats.state != "printing" %}
        UNLOAD_FILAMENT
        FORCE_MOVE STEPPER="extruder_stepper filament_buffer" DISTANCE=-1000 VELOCITY=50 ACCEL=5000
        FORCE_MOVE STEPPER="extruder_stepper filament_buffer" DISTANCE=-1000 VELOCITY=50 ACCEL=5000
        # hold the gcode stream until the ~40s tail spit-out physically completes
        # (mirrors Sovol 2.1.9; bench-check whether FORCE_MOVE already blocks — if it
        # does, this dwell is redundant but harmless)
        M400
        G4 P50000
    {% else %}
        {action_respond_info("Don't unload filament during printing!!!")}
    {% endif %}
