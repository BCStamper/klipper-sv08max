# SV08 MAX filament buffer — SYNCED variant (RECOMMENDED, AFC TurtleNeck pattern)
# The feeder motor runs as an [extruder_stepper] synced to the extruder; the push
# switch trims effective rotation_distance +/-10% (bang-bang follower). Zero custom
# klippy code — everything here is maintained upstream. Include EXACTLY ONE of
# buffer-synced.cfg / buffer-pushed.cfg.
#
# Clog-at-extruder detection is NOT in this variant (no discrete push events to
# watch) — the Orbiter toolhead motion sensor covers that failure mode instead.

[mcu buffer_mcu]                       # feeder STM32F103, CAN @ 1M
canbus_uuid: TODO_BUFFER_UUID

[extruder_stepper filament_buffer]
extruder:                              # not synced at boot; PRINT_START syncs
step_pin: buffer_mcu: PA8
dir_pin: buffer_mcu: PA9
enable_pin: !buffer_mcu: PA11
microsteps: 16
rotation_distance: 9.75
full_steps_per_rotation: 200

[tmc2209 extruder_stepper filament_buffer]
uart_pin: buffer_mcu: PA12
interpolate: True
run_current: 0.9
hold_current: 0.4
sense_resistor: 0.150
uart_address: 3

[gcode_macro _buffer_vars]
variable_base_rotation_distance: 9.75
variable_multiplier_high: 1.10         # push switch pressed = slack gone = overfeed 10%
variable_multiplier_low: 0.90          # released = slack ok = underfeed 10%
variable_synced: False
gcode:

[gcode_macro BUFFER_SYNC]
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=filament_buffer MOTION_QUEUE=extruder
    SET_GCODE_VARIABLE MACRO=_buffer_vars VARIABLE=synced VALUE=True
    # start at neutral-fast so the buffer catches up to current slack state
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=filament_buffer DISTANCE={printer["gcode_macro _buffer_vars"].base_rotation_distance / printer["gcode_macro _buffer_vars"].multiplier_high}

[gcode_macro BUFFER_DESYNC]
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=filament_buffer MOTION_QUEUE=
    SET_GCODE_VARIABLE MACRO=_buffer_vars VARIABLE=synced VALUE=False
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=filament_buffer DISTANCE={printer["gcode_macro _buffer_vars"].base_rotation_distance}

# Push switch: bang-bang trim while synced; jam watchdog armed on press
[gcode_button buffer_push]
pin: ^buffer_mcu: PB11
press_gcode:
    {% if printer["gcode_macro _buffer_vars"].synced %}
        SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=filament_buffer DISTANCE={printer["gcode_macro _buffer_vars"].base_rotation_distance / printer["gcode_macro _buffer_vars"].multiplier_high}
        UPDATE_DELAYED_GCODE ID=buffer_jam_check DURATION=5
    {% endif %}
release_gcode:
    {% if printer["gcode_macro _buffer_vars"].synced %}
        SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=filament_buffer DISTANCE={printer["gcode_macro _buffer_vars"].base_rotation_distance / printer["gcode_macro _buffer_vars"].multiplier_low}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=buffer_jam_check DURATION=0

# Jam = push switch held >5s while printing (overfeed can't keep up => tangle upstream)
[delayed_gcode buffer_jam_check]
gcode:
    {% if printer["gcode_button buffer_push"].state == "PRESSED" and printer.print_stats.state == "printing" %}
        SET_PIN PIN=green_led VALUE=0
        SET_PIN PIN=blue_led VALUE=1
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=winding_status VALUE=True
        PAUSE
        {action_respond_info("Filament jam detected: buffer starved >5s (winding?)")}
    {% endif %}

[filament_switch_sensor filament_sensor]   # buffer inlet — name is a contract, keep it
pause_on_runout: False
switch_pin: ^buffer_mcu: PA10
insert_gcode:
    SET_PIN PIN=green_led VALUE=1.00
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
runout_gcode:
    SET_PIN PIN=green_led VALUE=0.00
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
    CONTINUE_PRINT_D D=1100
    {action_respond_info("filament exhausted!")}

[output_pin red_led]
pin: !buffer_mcu: PC14
value: 0

[output_pin blue_led]
pin: !buffer_mcu: PC15
value: 0

[output_pin green_led]
pin: !buffer_mcu:PB1
value: 0

# Physical button on feeder: toggle continuous manual feed (FORCE_MOVE based)
[gcode_button manual_push]
pin: buffer_mcu: PA1
press_gcode:
release_gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected and printer["print_stats"].state != "printing" and printer["gcode_button stall_push_stop"].state != "PRESSED" %}
        {% if printer["gcode_macro variables"].is_manual_feeding %}
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
            UPDATE_DELAYED_GCODE ID=feed_loop DURATION=0
        {% else %}
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=False
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=True
            FEED_LOOP
        {% endif %}
    {% endif %}

[gcode_button stall_push_stop]
pin: ^buffer_mcu: PB10
press_gcode:
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
release_gcode:

[gcode_macro FEED_LOOP]
gcode:
  {% if printer["gcode_macro variables"].stop_feeding|default(False) %}
    { action_respond_info("stop push filament") }
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=False
  {% else %}
    FORCE_MOVE STEPPER="extruder_stepper filament_buffer" DISTANCE=2 VELOCITY=33
    UPDATE_DELAYED_GCODE ID=feed_loop DURATION=0.06
  {% endif %}

[delayed_gcode feed_loop]
gcode:
  FEED_LOOP

[gcode_macro MANUAL_FEED]
gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected and printer["gcode_button buffer_push"].state == "PRESSED" %}
        FORCE_MOVE STEPPER="extruder_stepper filament_buffer" DISTANCE=25 VELOCITY=100
    {% endif %}

[gcode_macro CHECK_FILAMENT_STATUS]
gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
        SET_PIN PIN=green_led VALUE=1
    {% else %}
        SET_PIN PIN=green_led VALUE=0
    {% endif %}
    SET_PIN PIN=red_led VALUE=0
    SET_PIN PIN=blue_led VALUE=0

[delayed_gcode INITIAL_FILAMENT_CHECK]
gcode:
    CHECK_FILAMENT_STATUS
initial_duration: 1

# Unload: while synced the buffer mirrors every G1 E automatically, so the paired
# choreography from stock collapses to plain extruder moves; the long spit-out
# happens desynced via FORCE_MOVE.
[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp = printer.extruder.target|int %}
    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" or current_target_temp == 0 %}
            M109 S{extruder_temp}
        {% elif current_target_temp >= printer.configfile.settings['extruder'].min_extrude_temp %}
            M109 S{current_target_temp}
        {% else %}
            M109 S{extruder_temp}
        {% endif %}
        BUFFER_SYNC
        G91
        G1 E30 F300
        G1 E-10 F1500
        G1 E-35 F600
        G1 E5 F600
        G1 E-5 F600
        M109 S160
        G1 E10 F300
        G1 E-10 F300
        G4 P3000
        G1 E-50 F300
        G90
        M400
        BUFFER_DESYNC
        FORCE_MOVE STEPPER="extruder_stepper filament_buffer" DISTANCE=-100 VELOCITY=10
        {% if current_target_temp == 0 or printer.print_stats.state != "paused" %}
            M104 S0
        {% endif %}
        M109 S{current_target_temp}
    {% else %}
        {action_respond_info("Don't unload filament during printing!!!")}
    {% endif %}

[gcode_macro BUFFER_LONG_UNLOAD_FILAMENT]
gcode:
    UNLOAD_FILAMENT
    FORCE_MOVE STEPPER="extruder_stepper filament_buffer" DISTANCE=-1000 VELOCITY=50
    FORCE_MOVE STEPPER="extruder_stepper filament_buffer" DISTANCE=-1000 VELOCITY=50
    # hold the gcode stream until the ~40s tail spit-out physically completes
    # (mirrors Sovol 2.1.9; bench-check whether FORCE_MOVE already blocks — if it
    # does, this dwell is redundant but harmless)
    M400
    G4 P50000
