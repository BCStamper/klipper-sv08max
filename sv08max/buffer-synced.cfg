# SV08 MAX filament buffer — discrete-push variant, redesigned 2026-07-27,
# rebuilt onto [manual_stepper] 2026-08-18.
# The feeder motor is a [manual_stepper]. It was originally [extruder_stepper]
# driven by FORCE_MOVE, but FORCE_MOVE turned out to be fundamentally wrong
# for repeated in-print use: its manual_move() helper (force_move.py) calls
# toolhead.flush_step_generation() BEFORE the move (force-flushing whatever
# the print itself had queued) and toolhead.dwell() for the move's full
# duration AFTER it -- functionally stronger than an M400, on every single
# PB11 trigger. Klipper's gcode command execution is single-threaded, so this
# blocked the ENTIRE print, not just the buffer, visibly stopping the
# toolhead on every push. Root-caused 2026-08-18 after it showed up as
# "toolhead stops every few moves" on a dense print (it was always happening,
# just hidden on simpler prints like the temp tower where pushes are sparser)
# and was very likely a major contributor to 2026-08-16/17's print_stall
# growth and repeated buffer_jam_check false-fires too (force-flushing the
# lookahead queue to empty and refilling from a dead stop is exactly the
# condition toolhead.py's _check_priming_state counts as a stall).
# [manual_stepper]'s own MANUAL_STEPPER command supports SYNC=0, which
# genuinely does not block (verified via manual_stepper.py: do_move() only
# calls the blocking sync_print_time()/dwell() path when sync=True). All
# print-time motion goes through the _BUFFER_MOVE helper below with SYNC=0.
# Load/unload macros use SYNC=1 (blocking) deliberately -- they already block
# throughout on M109/G4, and only ever run while NOT printing, so there's no
# concurrent motion to disrupt. manual_stepper has no SYNC_EXTRUDER_MOTION
# integration (that's an extruder_stepper-only mechanism), so the old
# BUFFER_SYNC/BUFFER_DESYNC toggle is gone entirely -- see _BUFFER_MOVE for
# how load/unload now track the extruder's own moves instead (matched,
# interleaved manual_stepper calls after each G1 E line, chunked at the same
# granularity the original F-coded moves already used).
#
# During normal printing the buffer is driven purely by the PB11/PB10 switch
# pair below, not by any lookahead/kinematic integration -- this is the
# spring-loaded telescoping slide joint that senses TENSION, not a slack-loop
# follower, specifically designed so the buffer doesn't need to track the
# extruder's small per-move retracts during printing (an earlier version
# tried true syncing -- AFC TurtleNeck pattern -- and it fought the hardware).
#
# PB11 (buffer_push, "lower" switch): tension pulls the joint down as the
# extruder draws down the staged filament -> triggers a single discrete push.
# PB10 (stall_push_stop, "upper" switch): spring returns the joint up once
# tension is relieved -> in stock, gates the manual feed loop only; here it
# ALSO doubles as clog detection (see buffer_clog_check below).
# Jam (PB11 stuck after a push = upstream, spool-to-buffer) and clog (PB10
# stuck while printing = downstream, buffer-to-nozzle) are separate checks on
# the two switches; filament_switch_sensor below still handles runout.
#
# EVERY buffer move MUST specify ACCEL explicitly (even though _BUFFER_MOVE
# defaults it to 5000 as a safety net). Klipper's calc_move_time (shared by
# force_move.py and manual_stepper, both call it) silently treats omitted/0
# accel as "instant, zero-time acceleration", which a real stepper physically
# cannot follow -- it just stalls at the start of the move with no error
# anywhere. Found the hard way, 2026-08-03, with FORCE_MOVE; the same
# calc_move_time is still in the call chain here, so the risk is identical.
#
# Include EXACTLY ONE of buffer-synced.cfg / buffer-pushed.cfg.

[mcu buffer_mcu]                       # feeder STM32F103, CAN @ 1M
canbus_uuid: 4ff8d1a962f9

[manual_stepper filament_buffer]
step_pin: buffer_mcu: PA8
dir_pin: buffer_mcu: PA9
enable_pin: !buffer_mcu: PA11
microsteps: 16
rotation_distance: 9.75
full_steps_per_rotation: 200
velocity: 60
accel: 5000

[tmc2209 manual_stepper filament_buffer]
uart_pin: buffer_mcu: PA12
interpolate: True
run_current: 0.9
hold_current: 0.4
sense_resistor: 0.150
uart_address: 3

# Tracks the buffer stepper's cumulative position. Needed because
# MANUAL_STEPPER's MOVE= is an ABSOLUTE target (unlike FORCE_MOVE's relative
# DISTANCE=), and manual_stepper exposes no queryable position status the way
# extruder_stepper did -- printer["manual_stepper filament_buffer"] has
# nothing to read back. Deliberately never reset mid-print (SET_POSITION=
# calls toolhead.flush_step_generation() internally, the same early-flush
# behavior we're trying to eliminate) -- an unbounded float accumulating over
# even a very long print has no meaningful precision loss at this scale.
[gcode_macro _buffer_vars]
variable_position: 0
gcode:

# Central helper for all buffer stepper motion, replacing every former
# FORCE_MOVE call. Mirrors FORCE_MOVE's relative DISTANCE= interface as
# DELTA= while handling the absolute-position bookkeeping internally.
# SYNC=0 (default) is what actually fixes the whole-toolhead-blocking bug --
# see the header note. Every load/unload call site explicitly passes SYNC=1.
# ENABLE=1 on every call: unlike FORCE_MOVE (which auto-enables via
# _force_enable() on every call), manual_stepper's do_move() does NOT
# auto-enable -- without this, a fresh Klipper restart could leave the first
# push silently doing nothing (commanded to move while disabled, no error).
# Cheap and harmless when already enabled -- just a GPIO write, no toolhead/
# dwell interaction at all, safe even on the SYNC=0 path.
[gcode_macro _BUFFER_MOVE]
gcode:
    {% set delta = params.DELTA|float %}
    {% set speed = params.SPEED|float %}
    {% set accel = params.ACCEL|default(5000)|float %}
    {% set sync = params.SYNC|default(0)|int %}
    {% set new_pos = printer["gcode_macro _buffer_vars"].position + delta %}
    SET_GCODE_VARIABLE MACRO=_buffer_vars VARIABLE=position VALUE={new_pos}
    MANUAL_STEPPER STEPPER=filament_buffer ENABLE=1 MOVE={new_pos} SPEED={speed} ACCEL={accel} SYNC={sync}

# Push switch (PB11): fires ONE discrete push per trigger, matching stock's
# do_move shape (push_length=25mm kept from stock; velocity dropped from
# stock's 150mm/s to 60mm/s -- stock's motion was loud and sudden, this is a
# bench-tuning starting point, not a derived value). Jam-check arm delay =
# move duration (25/60 ~= 0.42s) + settle margin, using stock's own
# event_delay convention (2.0s) as that margin -> ~2.5s.
# SYNC=0 here is the fix: this is the one call site that fires during active
# printing, so it's the one that must never block the main toolhead.
[gcode_button buffer_push]
pin: ^buffer_mcu: PB11
press_gcode:
    {% if printer.print_stats.state == "printing" %}
        _BUFFER_MOVE DELTA=25 SPEED=60 ACCEL=5000 SYNC=0
        UPDATE_DELAYED_GCODE ID=buffer_jam_check DURATION=2.5
    {% endif %}
release_gcode:

# Jam = PB11 still triggered ~2.5s after a push, while printing: the push
# didn't relieve tension, so filament isn't advancing -> upstream of the
# buffer (spool-to-buffer segment) is blocked.
# Guard added 2026-08-17: a starved push during an active CONTINUE_PRINT_D
# runout-tail drain (filament_detected already False) is expected, not a jam
# -- the buffer legitimately has nothing left to push once the cut end has
# cleared it. Without this, a real runout's own tail-drain got cut short by
# this check firing first, wasting usable trailing filament.
[delayed_gcode buffer_jam_check]
gcode:
    {% if printer["gcode_button buffer_push"].state == "PRESSED" and printer.print_stats.state == "printing" and printer["filament_switch_sensor filament_sensor"].filament_detected == True %}
        SET_PIN PIN=green_led VALUE=0
        SET_PIN PIN=blue_led VALUE=1
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=winding_status VALUE=True
        PAUSE
        {action_respond_info("Filament jam detected: buffer starved after push (upstream?)")}
    {% endif %}

[filament_switch_sensor filament_sensor]   # buffer inlet — name is a contract, keep it
pause_on_runout: False
switch_pin: ^buffer_mcu: PA10
insert_gcode:
    SET_PIN PIN=green_led VALUE=1.00
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
runout_gcode:
    SET_PIN PIN=green_led VALUE=0.00
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
    CONTINUE_PRINT_D D=1100
    {action_respond_info("filament exhausted!")}

[output_pin red_led]
pin: !buffer_mcu: PC14
value: 0

[output_pin blue_led]
pin: !buffer_mcu: PC15
value: 0

[output_pin green_led]
pin: !buffer_mcu:PB1
value: 0

# Physical button on feeder: toggle continuous manual feed (via FEED_LOOP)
[gcode_button manual_push]
pin: buffer_mcu: PA1
press_gcode:
release_gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected and printer["print_stats"].state != "printing" and printer["gcode_button stall_push_stop"].state != "PRESSED" %}
        {% if printer["gcode_macro variables"].is_manual_feeding %}
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
            UPDATE_DELAYED_GCODE ID=feed_loop DURATION=0
        {% else %}
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=False
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=True
            FEED_LOOP
        {% endif %}
    {% endif %}

# PB10 keeps its stock role gating the manual feed loop, and now also arms
# clog detection whenever it triggers during a print (see buffer_clog_check).
[gcode_button stall_push_stop]
pin: ^buffer_mcu: PB10
press_gcode:
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
    {% if printer.print_stats.state == "printing" %}
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=clog_check_start_extrusion VALUE={printer.print_stats.filament_used|float}
        UPDATE_DELAYED_GCODE ID=buffer_clog_check DURATION=30
    {% endif %}
release_gcode:

# Clog = PB10 still triggered 30s after it last armed, while printing AND the
# gcode stream is still actually commanding extrusion: the joint sprung fully
# back (buffer topped up, no tension) and nothing has demanded more filament
# since -> downstream (extruder/nozzle) isn't actually consuming despite the
# gcode commanding it. Note: every new press re-arms this to +30s, and a
# press can only happen after an intervening release, so this only fires if
# PB10 has genuinely sat triggered, unbroken, the whole window -- a brief
# release anywhere in there correctly prevents it.
# 30s is a bench-tuning starting point, not derived. Stock's own equivalent
# (NOZZLE_CLOG_CHECK, still on disk unused) watched 50mm of the print's own
# filament_used odometer advancing without a push event, confirmed with a
# second check 5s later before pausing -- a different signal (distance vs.
# switch duration) so not a direct port, but the "detect once, don't act on
# a single blip" philosophy carried over.
# filament_used delta added 2026-08-17: print_stats.state stays "printing"
# through end-of-print's own tail (cooldown waits, park moves) even once the
# gcode stream has no more extrusion left to issue, and PB10 sitting
# triggered with genuinely nothing left to demand is correct, not a fault --
# false-fired at the end of the 2026-08-16 temp tower for exactly this reason.
# filament_used is Klipper's commanded odometer (tracks gcode E-moves, not
# physical flow), so it still climbs normally through a real clog -- this
# only rules out "nothing was commanded at all," it doesn't replace PB10 as
# the actual clog signal.
[delayed_gcode buffer_clog_check]
gcode:
    {% if printer["gcode_button stall_push_stop"].state == "PRESSED" and printer.print_stats.state == "printing" and (printer.print_stats.filament_used|float - printer["gcode_macro variables"].clog_check_start_extrusion|float) > 0 %}
        SET_PIN PIN=green_led VALUE=0
        SET_PIN PIN=red_led VALUE=1
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=winding_status VALUE=True
        PAUSE
        {action_respond_info("Nozzle clog suspected: buffer fully fed, no downstream demand for 30s")}
    {% endif %}

# Manual feed loop (physical button held): only ever runs while NOT printing
# (see manual_push's own guard above), so SYNC=1 (blocking) is fine here.
[gcode_macro FEED_LOOP]
gcode:
  {% if printer["gcode_macro variables"].stop_feeding|default(False) %}
    { action_respond_info("stop push filament") }
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=False
  {% else %}
    _BUFFER_MOVE DELTA=2 SPEED=33 ACCEL=5000 SYNC=1
    UPDATE_DELAYED_GCODE ID=feed_loop DURATION=0.06
  {% endif %}

[delayed_gcode feed_loop]
gcode:
  FEED_LOOP

# Called from RESUME and LOAD_FILAMENT -- never during active print motion,
# so SYNC=1 (blocking) is fine here too.
[gcode_macro MANUAL_FEED]
gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected and printer["gcode_button buffer_push"].state == "PRESSED" %}
        _BUFFER_MOVE DELTA=25 SPEED=100 ACCEL=5000 SYNC=1
    {% endif %}

[gcode_macro CHECK_FILAMENT_STATUS]
gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
        SET_PIN PIN=green_led VALUE=1
    {% else %}
        SET_PIN PIN=green_led VALUE=0
    {% endif %}
    SET_PIN PIN=red_led VALUE=0
    SET_PIN PIN=blue_led VALUE=0

[delayed_gcode INITIAL_FILAMENT_CHECK]
gcode:
    CHECK_FILAMENT_STATUS
initial_duration: 1

# Unload: nets ~65mm of extruder-only retraction, more than the spring
# joint's passive travel can absorb on its own -- see the header note. Each
# G1 E line gets a matching _BUFFER_MOVE (same distance, comparable speed,
# SYNC=1) immediately after it, at the same chunking the original F-coded
# moves already used, so the buffer never lags the extruder by more than one
# of these existing sub-move sizes at a time. Only runs while not printing
# (guarded below), so the blocking SYNC=1 costs nothing -- this whole macro
# already blocks throughout on M109/G4 anyway.
[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp = printer.extruder.target|int %}
    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" or current_target_temp == 0 %}
            M109 S{extruder_temp}
        {% elif current_target_temp >= printer.configfile.settings['extruder'].min_extrude_temp %}
            M109 S{current_target_temp}
        {% else %}
            M109 S{extruder_temp}
        {% endif %}
        G91
        G1 E30 F300
        _BUFFER_MOVE DELTA=30 SPEED=5 ACCEL=5000 SYNC=1
        G1 E-10 F1500
        _BUFFER_MOVE DELTA=-10 SPEED=25 ACCEL=5000 SYNC=1
        G1 E-35 F600
        _BUFFER_MOVE DELTA=-35 SPEED=10 ACCEL=5000 SYNC=1
        G1 E5 F600
        _BUFFER_MOVE DELTA=5 SPEED=10 ACCEL=5000 SYNC=1
        G1 E-5 F600
        _BUFFER_MOVE DELTA=-5 SPEED=10 ACCEL=5000 SYNC=1
        M109 S160
        G1 E10 F300
        _BUFFER_MOVE DELTA=10 SPEED=5 ACCEL=5000 SYNC=1
        G1 E-10 F300
        _BUFFER_MOVE DELTA=-10 SPEED=5 ACCEL=5000 SYNC=1
        G4 P3000
        G1 E-50 F300
        _BUFFER_MOVE DELTA=-50 SPEED=5 ACCEL=5000 SYNC=1
        G90
        M400
        _BUFFER_MOVE DELTA=-100 SPEED=10 ACCEL=5000 SYNC=1
        {% if current_target_temp == 0 or printer.print_stats.state != "paused" %}
            M104 S0
        {% endif %}
        M109 S{current_target_temp}
    {% else %}
        {action_respond_info("Don't unload filament during printing!!!")}
    {% endif %}

# Guarded 2026-08-03: previously called UNLOAD_FILAMENT and then unconditionally
# proceeded into the two raw pulls regardless of whether UNLOAD_FILAMENT actually
# did anything (its own print_stats.state guard could no-op it) -- meaning a cold,
# unretracted pull straight off the extruder gear was possible. Also worth knowing:
# PAUSE calls this macro automatically on a filament-change event, not just manual
# testing, so this gap was live on that path too.
[gcode_macro BUFFER_LONG_UNLOAD_FILAMENT]
gcode:
    {% if printer.print_stats.state != "printing" %}
        UNLOAD_FILAMENT
        _BUFFER_MOVE DELTA=-1000 SPEED=50 ACCEL=5000 SYNC=1
        _BUFFER_MOVE DELTA=-1000 SPEED=50 ACCEL=5000 SYNC=1
        # hold the gcode stream until the ~40s tail spit-out physically completes
        # (mirrors Sovol 2.1.9). Confirmed 2026-08-18 (manual_stepper.py source
        # read directly) that SYNC=1 above already blocks for the full move
        # duration -- this dwell is genuinely redundant now, kept anyway as an
        # explicit, self-documenting wait rather than relying on that being
        # obvious from the SYNC=1 alone.
        G4 P50000
    {% else %}
        {action_respond_info("Don't unload filament during printing!!!")}
    {% endif %}
