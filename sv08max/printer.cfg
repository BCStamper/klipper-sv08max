[mcu EBBCan]                           # new toolhead EBB36 v1.2 (STM32G0B1)
canbus_uuid: 3d42debd8235              # confirmed via canbus_query.py 2026-09-05, running Klipper (Katapult install + CAN flash both succeeded)

# [mcu eddy] TEMPORARILY DISABLED (2026-09-05): isolating the mainboard/EBB36
# mystery-CAN-traffic issue from the still-unresolved Eddy Duo (its real UUID
# has never been found -- 4ff8d1a962f9 above was the BUFFER's, a leftover
# mixup from earlier tonight, not the Eddy Duo). Bringing the printer up
