# canbus_uuid: 4ff8d1a962f9

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 20000                       # Stage 1's proven starting value; 04-I.6 walks this up after shakedown
minimum_cruise_ratio: 0.25
max_z_velocity: 10
max_z_accel: 500
square_corner_velocity: 5.0

[force_move]
enable_force_move: True

[idle_timeout]
gcode:
    _DEMON_IDLE_TIMEOUT
timeout: 3600

[firmware_retraction]
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0.0
unretract_speed: 30

[pause_resume]
[display_status]
[respond]
[exclude_object]

[gcode_arcs]
resolution: 1.0

[virtual_sdcard]
path: /home/sovol/printer_data/gcodes

[save_variables]
filename: /home/sovol/printer_data/config/saved_variables.cfg

########################################
# X/Y steppers — mainboard pins unchanged; endstop + travel change with the
# new carriage
########################################

[stepper_x]
step_pin: PE1
dir_pin: PD7
enable_pin: !PD5
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^!EBBCan:PB6              # switch now lives on the toolhead (EBB36),
                                       # not the mainboard — sensorless is NOT
                                       # available on this board (no TMC5160 DIAG
                                       # routing). PD6 on the mainboard is the
                                       # documented spare/fallback port if PB6
                                       # misbehaves.
                                       # `!` added 2026-09-05 (order corrected to `^!`
                                       # after a second halt — Klipper's pins.py checks
                                       # for `^`/`~` before `!`, so `^` must come first):
                                       # this switch is wired
                                       # normally-closed, not the more common
                                       # normally-open. With a pullup and the switch
                                       # to GND, NC reads LOW at rest and HIGH when
                                       # actually pressed — the opposite of what
                                       # Klipper's default (unmodified) polarity
                                       # expects. Without the inversion, Klipper
                                       # would consider the endstop triggered while
                                       # away from it and not-triggered once actually
                                       # pressed — homing could drive straight
                                       # through the real trigger point.
position_min: -11                      # TODO (04-F): verify, don't assume — Ben's
position_endstop: -11                  # adapter was specifically designed (per the
position_max: 502                      # Sovol Fusion model) to mount the switch in the
                                       # same physical spot as stock, so these Stage 1
                                       # values should hold, but "should" per the
                                       # designer's own words — confirm with the real
                                       # 04-F jog-and-check before trusting it.
homing_speed: 60                       # conservative for bring-up (04-F.1); restore
                                       # 120 (Stage 1's value) once trusted (04-F.4)
homing_retract_dist: 3
homing_retract_speed: 15.0

[tmc5160 stepper_x]
cs_pin: PE0
spi_software_mosi_pin: PB6
spi_software_miso_pin: PB5
spi_software_sclk_pin: PB4
interpolate: false
run_current: 3.0
sense_resistor: 0.05
stealthchop_threshold: 0

[stepper_y]
step_pin: PD3
dir_pin: PD2
enable_pin: !PD0
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^PD1                      # frame-mounted (triggered by the gantry, not
                                       # the toolhead), unchanged hardware from Stage 1
position_min: -1
position_endstop: 505                  # TODO (04-F): verify anyway — Y is triggered by
                                       # the gantry rather than anything toolhead-
                                       # mounted, so this is lower-risk than X, but
                                       # confirm with the real jog-and-check rather
                                       # than assume from that alone
position_max: 505
homing_speed: 60                       # see stepper_x note
homing_retract_dist: 3
homing_retract_speed: 15.0

[tmc5160 stepper_y]
cs_pin: PD4
spi_software_mosi_pin: PB6
spi_software_miso_pin: PB5
spi_software_sclk_pin: PB4
interpolate: false
run_current: 3.0
sense_resistor: 0.05
stealthchop_threshold: 0

########################################
# Z steppers x4 (mainboard, unchanged from Stage 1 — belt-driven per corner,
# NOT leadscrew, despite gear_ratio looking that way at a glance)
########################################

[stepper_z]   # z1 front-left
step_pin: PA8
dir_pin: PC9
enable_pin: !PA10
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16
endstop_pin: ^PC1                      # TEMPORARY DUMMY (2026-09-05): real value is
                                       # probe:z_virtual_endstop, but the probe object
                                       # is disabled for this isolation test. PC1 is
                                       # confirmed unused anywhere else in this file --
                                       # physically meaningless, exists only so config
                                       # parses and klippy can reach a stable
                                       # (non-crashing) state to test MCU connectivity.
                                       # Z will NOT home correctly like this -- revert
                                       # to probe:z_virtual_endstop once the eddy probe
                                       # stack is re-enabled.
position_max: 505
position_min: -1.5                     # Stage 1's safety fix (stock -10 risks driving
                                       # the nozzle through the bed on a homing error)
homing_speed: 10.0
homing_retract_dist: 5.0
homing_retract_speed: 10.0
second_homing_speed: 5.0

[tmc2209 stepper_z]
uart_pin: PA9
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

[stepper_z1]  # z2
step_pin: PC6
dir_pin: !PD15
enable_pin: !PC8
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

[stepper_z2]  # z3
step_pin: PA5
dir_pin: PA4
enable_pin: !PA7
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PA6
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

[stepper_z3]  # z4
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB15
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PB14
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

########################################
# Extruder — Orbiter v2.5 + Rapido 2 UHF Plus (PT100 via EBB36's onboard
# MAX31865). Pins cross-checked against BTT's own EBB36 v1.2 sample config
# and this project's own Orbiter Smart Sensor research (04-ORBITER-SMART-
# SENSOR.md) for consistency — both independently agree on this pin set.
########################################

[extruder]
step_pin: EBBCan:PD0
dir_pin: EBBCan:PD1                    # TODO (04-E): verify direction on first
                                       # extrude, invert if needed
enable_pin: !EBBCan:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637               # Orbiter v2.5 nominal — TODO (04-I.2):
                                       # verify with a real 100mm-hot extrude test
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150
max_extrude_cross_section: 5
heater_pin: EBBCan:PB13
sensor_type: MAX31865
sensor_pin: EBBCan:PA4
spi_bus: spi1
rtd_nominal_r: 1000                    # PT1000 (Ben's actual Rapido 2 Plus UHF is
                                       # PT1000, not PT100 — corrected 2026-09-01,
                                       # DIP switches on the EBB36 already set to
                                       # 2-wire PT1000 per bigtreetech/docs' table:
                                       # ON ON OFF ON)
rtd_reference_r: 4300                  # Scaled from Stage 1/original 430 by the same
                                       # ~4.3x convention MAX31865 reference designs
                                       # use (430 for PT100, 4300 for PT1000) — not
                                       # independently confirmed against an EBB36 v1.2
                                       # schematic (BTT has an open, acknowledged doc
                                       # bug in this exact area: bigtreetech/EBB#158).
                                       # Self-correcting if wrong: a 10x reference
                                       # mismatch gives an obviously implausible or
                                       # faulted reading, not a subtle error — the
                                       # 04-E "reads plausible room temp" check will
                                       # catch it immediately before anything heats up.
rtd_num_of_wires: 2
min_temp: 0
max_temp: 350
min_extrude_temp: 150
control: pid                           # TODO (04-I.1): PID_CALIBRATE HEATER=extruder TARGET=250
pid_Kp: 20.0                           # placeholder — MUST calibrate before printing
pid_Ki: 1.0
pid_Kd: 80.0
pressure_advance: 0.025                # starting point; PETG-CF wants ~0.03-0.05 (04-I.4)
pressure_advance_smooth_time: 0.035

[tmc2209 extruder]
uart_pin: EBBCan:PA15
run_current: 0.85                      # Orbiter v2.5 LDO-36STH20-1004AHG
stealthchop_threshold: 0

########################################
# Fans — single toolhead fan now (2x4010 blowers wired parallel), replacing
# Stage 1's dual fan0/fan1 M106/M107 wrapper (04-I.5: drop the wrapper, native
# M106 takes over with a real [fan])
########################################

[fan]
pin: EBBCan:PA0

[heater_fan hotend_fan]                # 2510 axial
