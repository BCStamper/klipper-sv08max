# Sovol SV08 MAX — MAINLINE Klipper, NEW TOOLHEAD (Stage 2 / Yavoth Demon Remix)
#
# *** UNTESTED DRAFT — placeholders marked TODO must be resolved during
#     04-TOOLHEAD-CHANGEOVER.md's own bring-up sequence (sections D-I) before
#     trusting this to print. Rebuilt 2026-08-3x from printer-stock-toolhead.cfg's
#     proven structure -- the previous draft (last touched 2026-07-08) predated
#     the entire DKEU integration and the eddy-probe-range debugging arc and
#     should not be used as a reference for anything below. ***
#
# Toolhead: Yavoth Demon Remix carriage / EBB36 CAN v1.2 (onboard ADXL345,
# MAX31865) / BTT Eddy Duo (CAN) / Rapido 2 UHF Plus (PT100) / Orbiter v2.5 /
# 2x4010 blowers / 2510 hotend fan. Mainboard, Z motors, bed, and frame are
# UNCHANGED from Stage 1 — only pull those sections from this file if you're
# specifically comparing, don't assume they need re-verification.
#
# Probe: probe_eddy_current (mainline core), object name `eddy` — same driver
# AND same object name as Stage 1, deliberately, so DKEU's homing macros (which
# check for the exact name `eddy`) don't need re-patching. NOT eddy-ng: verified
# 2026-08-3x that vvuk/eddy-ng#146 (the Z-homing-circularity bug that pushed
# Stage 1 off eddy-ng originally) is still open with no merged fix, AND that
# it no longer matters anyway — mainline's own probe_eddy_current gained native
# tap support (METHOD=tap, PROBE_EDDY_CURRENT_TAP_CALIBRATE), confirmed already
# present in this fork. No eddy-ng install needed on either new MCU. Full
# reasoning: sv08-max-mainline-klipper skill (references/eddy-probe.md) and
# sv08max/docs/04-TOOLHEAD-CHANGEOVER.md.
#
# No buffer: shelved project-wide 2026-08-19 after three rebuild attempts each
# hit a different real Klipper motion-queue limitation (last one: calc_junction()
# doesn't set real junction velocity across non-kinematic moves — a structural
# property of the shared lookahead queue, not fixable via config). Not a Stage-2
# regression — this file just doesn't carry the buffer forward at all. Full
# story: skill's references/filament-buffer.md.
#
# TODOs still open in this file (resolved in 04-TOOLHEAD-CHANGEOVER.md's own
# section order — don't jump ahead of the physical bring-up):
#   - probe max_sensor_hz/descend_z, tap_threshold/tap_z_offset (section G —
#     depend on this specific coil's own calibration curve, do not reuse
#     Stage 1's stock-coil numbers). Needs live PROBE_EDDY_CURRENT_CALIBRATE.
#   - temperature_probe eddy drift compensation calibration (section G.6,
#     TEMPERATURE_PROBE_CALIBRATE) — not yet run.
#   - ADXL345 axes_map (section E — shake test)
#
# RESOLVED 2026-09-08: extruder dir_pin verified correct (STEPPER_BUZZ, hot),
# PID tuned (kp=38.415 live in SAVE_CONFIG), rotation_distance corrected for
# the real +10% flow found across several print starts (see the extruder
# section's own comment). Z-offset (-0.165) locked in via a new
# _CUSTOM_PRE_PRINT hook -- see demon_custom_expansion. Orbiter Smart Sensor
# wired (see the LEDs+sensing section below); first deploy immediately
# caught a real false-trigger-on-boot bug (fixed same day, see that
# section's own comment) -- still wants a real tug/tangle bench test before
# fully trusting it unattended, but the boot-time false-positive is closed.
#
# RESOLVED 2026-09-06: EBB36 + Eddy Duo canbus_uuid (found after fixing a
# CAN-H/CAN-L wiring bug on the Duo itself, see the skill's hardware.md);
# stepper_x/y position_min/position_endstop/position_max (Ben confirmed the
# carriage adapter was designed to keep the nozzle at the same physical spot
# relative to the mount/endstops as Stage 1 — still flagged for a real
# jog-and-check per 04-F before fully trusting it, but not a config unknown
# anymore); probe x_offset/y_offset (0, 26.72 — Duo mounted directly behind
# the nozzle); [bed_mesh] mesh_min/mesh_max and [quad_gantry_level] points
# (recomputed/verified from the now-known real offsets).
#
# Reminder that lives outside this file: once this deploys, re-run DKEU's
# Heat_Soak installer step and pick option 3 (Heat_Soak_Toolhead_LEDs.cfg,
# 2-chain) instead of Stage 1's option 1 (dummy-pin) — this toolhead has the
# 2-chain NeoPixels the stock one didn't. Also flip demon_user_settings'
# variable_neopixel_led to True once that's done.

[include plr.cfg]
[include ./Demon_Klipper_Essentials_Unified/*.cfg]
[include ./Demon_User_Files/*.cfg]
[include ./Demon_Klipper_Essentials_Unified/Other_Files/Demon_User_Files_Updater/Demon_User_Files_Handler_v*.cfg]
[include ./KAMP_LiTE/*.cfg]
[include ./Heat_Soak.cfg]
[include ./mainsail.cfg]
[include ./My_Macros.cfg]

