# Sovol SV08 MAX — MAINLINE Klipper, NEW TOOLHEAD (Stage 2 / Yavoth Demon Remix)
#
# *** UNTESTED DRAFT — placeholders marked TODO must be resolved during
#     04-TOOLHEAD-CHANGEOVER.md's own bring-up sequence (sections D-I) before
#     trusting this to print. Rebuilt 2026-08-3x from printer-stock-toolhead.cfg's
#     proven structure -- the previous draft (last touched 2026-07-08) predated
#     the entire DKEU integration and the eddy-probe-range debugging arc and
#     should not be used as a reference for anything below. ***
#
# Toolhead: Yavoth Demon Remix carriage / EBB36 CAN v1.2 (onboard ADXL345,
# MAX31865) / BTT Eddy Duo (CAN) / Rapido 2 UHF Plus (PT100) / Orbiter v2.5 /
# 2x4010 blowers / 2510 hotend fan. Mainboard, Z motors, bed, and frame are
# UNCHANGED from Stage 1 — only pull those sections from this file if you're
# specifically comparing, don't assume they need re-verification.
#
# Probe: probe_eddy_current (mainline core), object name `eddy` — same driver
# AND same object name as Stage 1, deliberately, so DKEU's homing macros (which
# check for the exact name `eddy`) don't need re-patching. NOT eddy-ng: verified
# 2026-08-3x that vvuk/eddy-ng#146 (the Z-homing-circularity bug that pushed
# Stage 1 off eddy-ng originally) is still open with no merged fix, AND that
# it no longer matters anyway — mainline's own probe_eddy_current gained native
# tap support (METHOD=tap, PROBE_EDDY_CURRENT_TAP_CALIBRATE), confirmed already
# present in this fork. No eddy-ng install needed on either new MCU. Full
# reasoning: sv08-max-mainline-klipper skill (references/eddy-probe.md) and
# sv08max/docs/04-TOOLHEAD-CHANGEOVER.md.
#
# No buffer: shelved project-wide 2026-08-19 after three rebuild attempts each
# hit a different real Klipper motion-queue limitation (last one: calc_junction()
# doesn't set real junction velocity across non-kinematic moves — a structural
# property of the shared lookahead queue, not fixable via config). Not a Stage-2
# regression — this file just doesn't carry the buffer forward at all. Full
# story: skill's references/filament-buffer.md.
#
# TODOs still open in this file (resolved in 04-TOOLHEAD-CHANGEOVER.md's own
# section order — don't jump ahead of the physical bring-up):
#   - EBB36 + Eddy Duo canbus_uuid (section D, after flashing)
#   - stepper_x/y position_min/position_endstop/position_max (section F — the
#     new carriage moves the nozzle relative to the endstops)
#   - probe x_offset/y_offset (section G — mechanical measurement)
#   - probe max_sensor_hz/descend_z, tap_threshold/tap_z_offset (section G —
#     depend on this specific coil's own calibration curve, do not reuse
#     Stage 1's stock-coil numbers)
#   - [bed_mesh] mesh_min/mesh_max (section G — depend on measured offsets)
#   - extruder rotation_distance/dir_pin/PID (section I — bench calibration)
#   - ADXL345 axes_map (section E — shake test)
#
# Reminder that lives outside this file: once this deploys, re-run DKEU's
# Heat_Soak installer step and pick option 3 (Heat_Soak_Toolhead_LEDs.cfg,
# 2-chain) instead of Stage 1's option 1 (dummy-pin) — this toolhead has the
# 2-chain NeoPixels the stock one didn't. Also flip demon_user_settings'
# variable_neopixel_led to True once that's done.

[include plr.cfg]
[include ./Demon_Klipper_Essentials_Unified/*.cfg]
[include ./Demon_User_Files/*.cfg]
[include ./Demon_Klipper_Essentials_Unified/Other_Files/Demon_User_Files_Updater/Demon_User_Files_Handler_v*.cfg]
[include ./KAMP_LiTE/*.cfg]
[include ./Heat_Soak.cfg]
[include ./mainsail.cfg]
[include ./My_Macros.cfg]

########################################
# MCUs
########################################

[mcu]                                  # mainboard STM32H750, USB-to-CAN bridge
canbus_uuid: b785e8392e4b              # KNOWN — same physical board as Stage 1, not reflashed for this swap

[mcu EBBCan]                           # new toolhead EBB36 v1.2 (STM32G0B1)
canbus_uuid: TODO_EBB36_UUID           # fill after flashing (04-B), re-query via canbus_query.py

[mcu eddy]                             # BTT Eddy Duo, DIP switch set to CAN
canbus_uuid: TODO_EDDY_UUID            # fill after flashing (04-B), re-query via canbus_query.py

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 20000                       # Stage 1's proven starting value; 04-I.6 walks this up after shakedown
minimum_cruise_ratio: 0.25
max_z_velocity: 10
max_z_accel: 500
square_corner_velocity: 5.0

[force_move]
enable_force_move: True

[idle_timeout]
gcode:
    _DEMON_IDLE_TIMEOUT
timeout: 3600

[firmware_retraction]
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0.0
unretract_speed: 30

[pause_resume]
[display_status]
[respond]
[exclude_object]

[gcode_arcs]
resolution: 1.0

[virtual_sdcard]
path: /home/sovol/printer_data/gcodes

[save_variables]
filename: /home/sovol/printer_data/config/saved_variables.cfg

########################################
# X/Y steppers — mainboard pins unchanged; endstop + travel change with the
# new carriage
########################################

[stepper_x]
step_pin: PE1
dir_pin: PD7
enable_pin: !PD5
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^EBBCan:PB6               # switch now lives on the toolhead (EBB36),
                                       # not the mainboard — sensorless is NOT
                                       # available on this board (no TMC5160 DIAG
                                       # routing). PD6 on the mainboard is the
                                       # documented spare/fallback port if PB6
                                       # misbehaves.
position_min: -11                      # TODO (04-F): re-measure — the new carriage
position_endstop: -11                  # moves the nozzle relative to the physical
position_max: 502                      # endstop. Stage 1 values shown as placeholders only.
homing_speed: 60                       # conservative for bring-up (04-F.1); restore
                                       # 120 (Stage 1's value) once trusted (04-F.4)
homing_retract_dist: 3
homing_retract_speed: 15.0

[tmc5160 stepper_x]
cs_pin: PE0
spi_software_mosi_pin: PB6
spi_software_miso_pin: PB5
spi_software_sclk_pin: PB4
interpolate: false
run_current: 3.0
sense_resistor: 0.05
stealthchop_threshold: 0

[stepper_y]
step_pin: PD3
dir_pin: PD2
enable_pin: !PD0
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^PD1                      # frame-mounted, unchanged from Stage 1
position_min: -1
position_endstop: 505                  # TODO (04-F): re-check nozzle datum, same
                                       # reason as stepper_x above
position_max: 505
homing_speed: 60                       # see stepper_x note
homing_retract_dist: 3
homing_retract_speed: 15.0

[tmc5160 stepper_y]
cs_pin: PD4
spi_software_mosi_pin: PB6
spi_software_miso_pin: PB5
spi_software_sclk_pin: PB4
interpolate: false
run_current: 3.0
sense_resistor: 0.05
stealthchop_threshold: 0

########################################
# Z steppers x4 (mainboard, unchanged from Stage 1 — belt-driven per corner,
# NOT leadscrew, despite gear_ratio looking that way at a glance)
########################################

[stepper_z]   # z1 front-left
step_pin: PA8
dir_pin: PC9
enable_pin: !PA10
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 505
position_min: -1.5                     # Stage 1's safety fix (stock -10 risks driving
                                       # the nozzle through the bed on a homing error)
homing_speed: 10.0
homing_retract_dist: 5.0
homing_retract_speed: 10.0
second_homing_speed: 5.0

[tmc2209 stepper_z]
uart_pin: PA9
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

[stepper_z1]  # z2
step_pin: PC6
dir_pin: !PD15
enable_pin: !PC8
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

[stepper_z2]  # z3
step_pin: PA5
dir_pin: PA4
enable_pin: !PA7
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PA6
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

[stepper_z3]  # z4
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB15
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PB14
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

########################################
# Extruder — Orbiter v2.5 + Rapido 2 UHF Plus (PT100 via EBB36's onboard
# MAX31865). Pins cross-checked against BTT's own EBB36 v1.2 sample config
# and this project's own Orbiter Smart Sensor research (04-ORBITER-SMART-
# SENSOR.md) for consistency — both independently agree on this pin set.
########################################

[extruder]
step_pin: EBBCan:PD0
dir_pin: EBBCan:PD1                    # TODO (04-E): verify direction on first
                                       # extrude, invert if needed
enable_pin: !EBBCan:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637               # Orbiter v2.5 nominal — TODO (04-I.2):
                                       # verify with a real 100mm-hot extrude test
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150
max_extrude_cross_section: 5
heater_pin: EBBCan:PB13
sensor_type: MAX31865
sensor_pin: EBBCan:PA4
spi_bus: spi1
rtd_nominal_r: 100                     # PT100
rtd_reference_r: 430                   # EBB36 onboard MAX31865 reference
rtd_num_of_wires: 2
min_temp: 0
max_temp: 350
min_extrude_temp: 150
control: pid                           # TODO (04-I.1): PID_CALIBRATE HEATER=extruder TARGET=250
pid_Kp: 20.0                           # placeholder — MUST calibrate before printing
pid_Ki: 1.0
pid_Kd: 80.0
pressure_advance: 0.025                # starting point; PETG-CF wants ~0.03-0.05 (04-I.4)
pressure_advance_smooth_time: 0.035

[tmc2209 extruder]
uart_pin: EBBCan:PA15
run_current: 0.85                      # Orbiter v2.5 LDO-36STH20-1004AHG
stealthchop_threshold: 0

########################################
# Fans — single toolhead fan now (2x4010 blowers wired parallel), replacing
# Stage 1's dual fan0/fan1 M106/M107 wrapper (04-I.5: drop the wrapper, native
# M106 takes over with a real [fan])
########################################

[fan]
pin: EBBCan:PA0

[heater_fan hotend_fan]                # 2510 axial
pin: EBBCan:PA1
heater: extruder
heater_temp: 50.0

[fan_generic fan2]                     # auxiliary (mainboard, unchanged)
pin: PB0
max_power: 1.0

[fan_generic fan3]                     # exhaust (mainboard, unchanged)
pin: PE11
max_power: 1.0

[heater_fan bed_fan]
pin: PE14
max_power: 1.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 35
tachometer_pin: PB10
tachometer_ppr: 2
tachometer_poll_interval: 0.001375

########################################
# Bed (mainboard, unchanged)
########################################

[thermistor bed_thermistor]
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 18085.4
temperature3: 100
resistance3: 5362.6

[heater_bed]
heater_pin: PD12
sensor_type: bed_thermistor
sensor_pin: PC5
max_power: 1.0
min_temp: 0
max_temp: 110
control: pid
pid_Kp: 73.571
pid_Ki: 1.820
pid_Kd: 783.849

########################################
# Probe — BTT Eddy Duo via mainline probe_eddy_current, object name `eddy`
# (see the file header for why not eddy-ng, and why this exact object name).
# i2c_mcu/i2c_bus pattern confirmed 2026-08-3x against BTT's own
# bigtreetech/Eddy sample config: a CAN/USB-connected Eddy hosts the LDC1612
# on its OWN onboard MCU, i2c_mcu/i2c_bus point at that MCU's internal bus
# (fixed name i2c0f), NOT software-bitbang pins the way Stage 1's stock coil
# needed (that coil hangs off the toolhead F103's own GPIOs instead).
########################################

[probe_eddy_current eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
max_sensor_hz: TODO_AFTER_CALIBRATION  # TODO (04-G.2): set from this coil's own
                                       # calibration peak frequency once
                                       # PROBE_EDDY_CURRENT_CALIBRATE has run —
                                       # do NOT reuse Stage 1's stock-coil value
                                       # (6031173), this is different hardware
descend_z: TODO_AFTER_CALIBRATION      # TODO (04-G.2): set after calibration —
                                       # must sit below z_park and below this
                                       # coil's own calibrated ceiling
                                       # simultaneously (see skill's
                                       # eddy-probe.md for why, Stage 1 hit this
                                       # exact bug)
x_offset: TODO_MEASURE                 # TODO (04-G.1): measure coil-center to
y_offset: TODO_MEASURE                 # nozzle-tip mechanically; ±1mm is fine
speed: 5
sample_retract_dist: 5.0
samples_tolerance: 0.0095
samples_tolerance_retries: 10
tap_threshold: TODO_AFTER_TAP_CALIBRATION  # TODO (04-G.3): PROBE_EDDY_CURRENT_TAP_CALIBRATE
tap_z_offset: 0.0                      # TODO (04-G.3): set once tap calibration is stable

[temperature_sensor eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy

[bed_mesh]
speed: 400
horizontal_move_z: 2
algorithm: bicubic
mesh_min: TODO,TODO                    # TODO (04-G.4): recompute from measured
mesh_max: TODO,TODO                    # offsets once known (mesh_min >= position_min
                                       # + offset, mesh_max <= position_max + offset,
                                       # clamped to the bed — BTT's own sample config
                                       # has the exact formula if useful)
probe_count: 60,60
fade_start: 0
fade_end: 10
scan_overshoot: 4

[quad_gantry_level]
gantry_corners:                        # same physical frame/gantry as Stage 1 — these
	-70,-40                        # are frame-geometry, not toolhead-geometry, so
	550,600                        # they carry forward unchanged
points:                                # same reasoning — verify reachable once probe
    50, 30                             # offsets are known (nozzle pos = point - offset),
    50, 470                            # per 04-G.5, but don't expect these to actually
    490, 470                           # need to move
    490, 30
speed: 400
horizontal_move_z: 3                   # Stage 1's proven-safe starting value (its
                                       # eddy-range ceiling forced this same number
                                       # across several independent macros) — verify
                                       # against this coil's own calibrated range
                                       # once 04-G.2 is done, don't assume unchanged
retry_tolerance: 0.1
retries: 15
max_adjust: 20

########################################
# Accelerometer + input shaper — onboard ADXL345 (EBB36), replacing Stage 1's
# separate LIS2DW on the stock toolhead
########################################

[adxl345]
cs_pin: EBBCan:PB12
spi_bus: spi2
axes_map: x,y,z                       # TODO (04-E): verify via MEASURE_AXES_NOISE /
                                       # shake test after mounting — don't assume this
                                       # matches the old stock-toolhead LIS2DW mapping
                                       # (x,z,y), it's a different chip on a different
                                       # mount orientation

[resonance_tester]
accel_chip: adxl345
probe_points:
    250, 250, 30

# [input_shaper] — leave unset; run SHAPER_CALIBRATE after 04-I.3

########################################
# LEDs + toolhead filament sensing
########################################

[neopixel toolhead_leds]
pin: EBBCan:PD3
chain_count: 2                         # this toolhead has 2 chained NeoPixels the
                                       # stock one didn't — re-run DKEU's Heat_Soak
                                       # installer step and pick option 3
                                       # (Heat_Soak_Toolhead_LEDs.cfg) once this
                                       # deploys, and flip demon_user_settings'
                                       # variable_neopixel_led to True
color_order: GRBW
initial_RED: 0.2
initial_GREEN: 0.2
initial_BLUE: 0.2
initial_WHITE: 0.2

# Orbiter Smart Sensor (presence + tangle detection) — mount goes in during
# the physical Stage 2 build, but the Klipper-side wiring below is
# DELIBERATELY DEFERRED to its own follow-up session per
# 04-ORBITER-SMART-SENSOR.md — don't uncomment this as part of the initial
# Stage 2 bring-up, it's flagged there as a way to avoid compounding unknowns
# in an already-complex first bring-up. When that follow-up happens, write
# custom runout_gcode/insert_gcode/press_gcode handlers calling into the
# existing PAUSE/UNLOAD_FILAMENT chain — do NOT import the sensor's own
# bundled PAUSE/RESUME/CANCEL_PRINT macro pack, it collides with DKEU the
# same way every other competing macro pack on this project has.
#[filament_switch_sensor O2_sensor]
#switch_pin: EBBCan:PB4
#
#[gcode_button filament_unload]
#pin: EBBCan:PB3

########################################
# Misc
########################################

[output_pin main_led]
pin: PD13
value: 1.0

[temperature_sensor mainboard_mcu]
sensor_type: temperature_mcu

[temperature_sensor ebb36_mcu]
sensor_type: temperature_mcu
sensor_mcu: EBBCan

[temperature_sensor host]
sensor_type: temperature_host

[include moonraker_obico_macros.cfg]
