########################################
# X/Y steppers — mainboard pins unchanged; endstop + travel change with the
# new carriage
########################################

[stepper_x]
step_pin: PE1
dir_pin: PD7
enable_pin: !PD5
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^EBBCan:PB6               # switch lives on the toolhead (EBB36), not
                                       # the mainboard — sensorless is NOT available
                                       # on this board (no TMC5160 DIAG routing).
                                       # PD6 on the mainboard is the documented
                                       # spare/fallback port if PB6 misbehaves.
                                       # `!` REMOVED 2026-09-06: the theoretical
                                       # NC-switch reasoning that added it
                                       # (2026-09-05) turned out backwards in
                                       # practice -- QUERY_ENDSTOPS directly proved
                                       # `^!` read TRIGGERED at physical rest and
                                       # NOT-TRIGGERED while actually held pressed
                                       # (verified live, both states, right before
                                       # this fix -- caused Z_Probe_Calibrate_Hot's
                                       # homing to see "already triggered" and never
                                       # move at all). Bare `^` (pullup, no invert)
                                       # is the empirically-confirmed-correct
                                       # polarity for this switch as actually wired
                                       # today -- don't re-add `!` from theory alone
                                       # again without re-checking QUERY_ENDSTOPS
                                       # live first, this connector's real behavior
                                       # has apparently changed since 09-05.
position_min: -11                      # TODO (04-F): verify, don't assume — Ben's
position_endstop: -11                  # adapter was specifically designed (per the
position_max: 502                      # Sovol Fusion model) to mount the switch in the
                                       # same physical spot as stock, so these Stage 1
                                       # values should hold, but "should" per the
                                       # designer's own words — confirm with the real
                                       # 04-F jog-and-check before trusting it.
homing_speed: 60                       # conservative for bring-up (04-F.1); restore
                                       # 120 (Stage 1's value) once trusted (04-F.4)
homing_retract_dist: 3
homing_retract_speed: 15.0

[tmc5160 stepper_x]
cs_pin: PE0
spi_software_mosi_pin: PB6
spi_software_miso_pin: PB5
spi_software_sclk_pin: PB4
interpolate: false
run_current: 3.0
sense_resistor: 0.05
stealthchop_threshold: 0

[stepper_y]
