# Sovol SV08 MAX — MAINLINE Klipper (master-tracking) draft config
# Toolhead: Yavoth Demon Remix / EBB36 CAN v1.2 (MAX31865) / BTT Eddy Duo (CAN)
#           Rapido 2 UHF Plus (PT100) / Orbiter v2.5 / 2x4010 blowers / 2510 axial
# Klipper branch: sv08max-master (tracks upstream master; motion_queuing era)
#
# *** UNTESTED DRAFT — placeholders marked TODO must be resolved before first run ***
#
# Host CAN setup (H750 runs USB-to-CAN bridge, all nodes at 1M):
#   ip link set can0 up type can bitrate 1000000  (persist via /etc/network/interfaces.d/can0)
# Find UUIDs after flashing each MCU:
#   ~/klipper/scripts/canbus_query.py can0
# NOTE: stock Sovol firmware hardcoded the UUIDs (0d1445047cdd / 61755fe321ac).
# Mainline derives them from the real chip ID — ALL UUIDs below will be new.
# NOTE: upstream master already allows the 128KiB bootloader on STM32H750 —
# no Kconfig patch needed on this branch.

[include buffer-synced.cfg]            # RECOMMENDED buffer variant (AFC pattern)
#[include buffer-pushed.cfg]           # alternative: stock-faithful discrete pushes
[include plr.cfg]                      # power-loss recovery (zero core patches)
[include macros.cfg]

########################################
# MCUs
########################################

[mcu]                                  # mainboard STM32H750, USB-to-CAN bridge
canbus_uuid: TODO_MAINBOARD_UUID

[mcu EBBCan]                           # toolhead EBB36 v1.2 (STM32G0B1)
canbus_uuid: TODO_EBB36_UUID

[mcu eddy]                             # BTT Eddy Duo, DIP switch set to CAN
canbus_uuid: TODO_EDDY_UUID

# [mcu buffer_mcu] lives in buffer_stepper.cfg

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 20000                       # stock ran 40000 with Sovol's inflated buffers;
                                       # start at 20k on mainline, raise after shakedown
minimum_cruise_ratio: 0.5
max_z_velocity: 10
max_z_accel: 500
square_corner_velocity: 5.0

[force_move]
enable_force_move: True

[idle_timeout]
timeout: 1800

[pause_resume]
[display_status]
[respond]
[exclude_object]

[gcode_arcs]
resolution: 1.0

[virtual_sdcard]
path: /home/sovol/printer_data/gcodes

[save_variables]
filename: /home/sovol/printer_data/config/saved_variables.cfg

########################################
# X/Y steppers (mainboard, unchanged pins)
########################################

[stepper_x]
step_pin: PE1
dir_pin: PD7
enable_pin: !PD5
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^EBBCan:PB6               # TODO: verify endstop header pin on EBB36 v1.2,
                                       # or switch to sensorless (see tmc5160 below)
position_min: -11                      # TODO: re-measure — Demon Remix moves the nozzle
position_endstop: -11                  # relative to the carriage; see BRINGUP.md Phase 2
position_max: 502                      # TODO: re-measure
homing_speed: 60                       # conservative for bring-up; stock was 120
homing_retract_dist: 3
homing_retract_speed: 15.0

[tmc5160 stepper_x]
cs_pin: PE0
spi_software_mosi_pin: PB6
spi_software_miso_pin: PB5
spi_software_sclk_pin: PB4
interpolate: false
run_current: 3.0
sense_resistor: 0.05
stealthchop_threshold: 0
# Sensorless homing alternative (if no X switch on new toolhead):
#   diag1_pin: !<mainboard DIAG pin — check Motherboard/Mcu_Pin_definition.pdf>
#   driver_SGT: <tune −64..63>
#   then stepper_x endstop_pin: tmc5160_stepper_x:virtual_endstop

[stepper_y]
step_pin: PD3
dir_pin: PD2
enable_pin: !PD0
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^PD1                      # frame-mounted, unchanged
position_min: -1
position_endstop: 505                  # TODO: re-check nozzle datum (Phase 2)
position_max: 505
homing_speed: 60
homing_retract_dist: 3
homing_retract_speed: 15.0

[tmc5160 stepper_y]
cs_pin: PD4
spi_software_mosi_pin: PB6
spi_software_miso_pin: PB5
spi_software_sclk_pin: PB4
interpolate: false
run_current: 3.0
sense_resistor: 0.05
stealthchop_threshold: 0

########################################
# Z steppers x4 (mainboard, unchanged)
########################################

[stepper_z]   # z1 front-left
step_pin: PA8
dir_pin: PC9
enable_pin: !PA10
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 505
position_min: -10
homing_speed: 10.0
homing_retract_dist: 5.0
homing_retract_speed: 10.0
second_homing_speed: 5.0

[tmc2209 stepper_z]
uart_pin: PA9
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

[stepper_z1]  # z2
step_pin: PC6
dir_pin: !PD15
enable_pin: !PC8
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

[stepper_z2]  # z3
step_pin: PA5
dir_pin: PA4
enable_pin: !PA7
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PA6
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

[stepper_z3]  # z4
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB15
rotation_distance: 40
gear_ratio: 80:12
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PB14
interpolate: true
run_current: 1.2
sense_resistor: 0.150
uart_address: 3
stealthchop_threshold: 999999

########################################
# Extruder — Orbiter v2.5 + Rapido 2 UHF Plus (PT100 via MAX31865)
########################################

[extruder]
step_pin: EBBCan:PD0
dir_pin: EBBCan:PD1                    # TODO: verify direction on first extrude, invert if needed
enable_pin: !EBBCan:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637               # Orbiter v2.5 nominal — verify (BRINGUP.md Phase 6)
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150
max_extrude_cross_section: 5
heater_pin: EBBCan:PB13
sensor_type: MAX31865
sensor_pin: EBBCan:PA4
spi_bus: spi1
rtd_nominal_r: 100                     # PT100
rtd_reference_r: 430                   # EBB36 MAX31865 onboard reference
rtd_num_of_wires: 2
min_temp: 0
max_temp: 350
min_extrude_temp: 150
control: pid                           # TODO: PID_CALIBRATE HEATER=extruder TARGET=250
pid_Kp: 20.0                           # placeholder — MUST calibrate before printing
pid_Ki: 1.0
pid_Kd: 80.0
pressure_advance: 0.025                # starting point — tune (Phase 6)
pressure_advance_smooth_time: 0.035

[tmc2209 extruder]
uart_pin: EBBCan:PA15
run_current: 0.85                      # Orbiter v2.5 LDO-36STH20-1004AHG
stealthchop_threshold: 0

########################################
# Fans
########################################

[fan]                                  # 2x GDSTime 4010 blowers, wired parallel
pin: EBBCan:PA0

[heater_fan hotend_fan]                # 2510 axial
pin: EBBCan:PA1
heater: extruder
heater_temp: 50.0

[fan_generic fan2]                     # auxiliary (mainboard, unchanged)
pin: PB0
max_power: 1.0

[fan_generic fan3]                     # exhaust (mainboard, unchanged)
pin: PE11
max_power: 1.0

[heater_fan bed_fan]
pin: PE14
max_power: 1.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 35
tachometer_pin: PB10
tachometer_ppr: 2
tachometer_poll_interval: 0.001375
# NOTE: Sovol's firmware-level fan-stall shutdown is gone on mainline.
# Tach is still readable in the UI; add a delayed_gcode watchdog later if wanted.

########################################
# Bed (mainboard, unchanged)
########################################

[thermistor bed_thermistor]
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 18085.4
temperature3: 100
resistance3: 5362.6

[heater_bed]
heater_pin: PD12
sensor_type: bed_thermistor
sensor_pin: PC5
max_power: 1.0
min_temp: 0
max_temp: 110
control: pid                           # stock values; re-run PID_CALIBRATE after cutover
pid_Kp: 73.571
pid_Ki: 1.820
pid_Kd: 783.849

########################################
# Probe — BTT Eddy Duo (CAN)
########################################

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
z_offset: 2.5                          # eddy trigger height, NOT first-layer offset — see docs
x_offset: 0.0                          # TODO: measure on mounted toolhead (BRINGUP.md Phase 3)
y_offset: 20.0                         # TODO: placeholder — MEASURE
# reg_drive_current: set automatically by LDC_CALIBRATE_DRIVE_CURRENT + SAVE_CONFIG

[temperature_probe btt_eddy]           # thermal drift compensation
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2
calibration_position: 250,250,5

[temperature_sensor eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy

[safe_z_home]
home_xy_position: 250,250              # TODO: after offsets known, set to
                                       # (250 - x_offset, 250 - y_offset) so the COIL
                                       # is over bed center when homing Z
z_hop: 10
z_hop_speed: 10

[bed_mesh]
speed: 400
horizontal_move_z: 2
algorithm: bicubic
mesh_min: 15,25                        # TODO: recompute from measured offsets:
mesh_max: 485,495                      #   mesh_min >= (position_min + offset, ...), >= bed edge
probe_count: 50,50                     #   mesh_max <= (position_max + offset, ...), <= 500
adaptive_margin: 5
fade_start: 1
fade_end: 10
fade_target: 0
#scan_overshoot: 4                     # enable if X travel allows after Phase 2

[quad_gantry_level]
gantry_corners:
	-70,-40
	550,600
points:                                # TODO: confirm all 4 PROBE positions reachable
    50, 30                             # with new offsets (nozzle pos = point - offset)
    50, 470
    490, 470
    490, 30
speed: 400
horizontal_move_z: 15
retry_tolerance: 0.1
retries: 15
max_adjust: 20

########################################
# Accelerometer + input shaper
########################################

[adxl345]                              # onboard on this EBB36 variant — no external unit needed
cs_pin: EBBCan:PB12
spi_bus: spi2
axes_map: x,y,z                        # TODO: verify axes after mounting (MEASURE_AXES_NOISE / shake test)

[resonance_tester]
accel_chip: adxl345
probe_points:
    250, 250, 30

# [input_shaper] — leave unset; run SHAPER_CALIBRATE after Phase 6

########################################
# LEDs + misc
########################################

# Orbiter filament sensor on the toolhead (optional, uncomment when wired).
# NAMING CONTRACT: the buffer's sensor MUST stay named "filament_sensor" —
# buffer_stepper.py and the feeder macros look it up by that exact name.
# This one is a SECOND sensor at the toolhead, so it gets its own name.
#[filament_switch_sensor toolhead_filament]
#switch_pin: ^EBBCan:PB4               # TODO: verify header pin for your sensor wiring
#pause_on_runout: True
#runout_gcode:
#    {action_respond_info("Toolhead runout — filament broke between buffer and extruder?")}
#
#[filament_motion_sensor toolhead_motion]
#switch_pin: ^EBBCan:PB3               # TODO: verify
#detection_length: 10.0
#extruder: extruder
#pause_on_runout: True
#runout_gcode:
#    {action_respond_info("Toolhead motion fault — jam/clog/grind detected")}
# NOTE: hardware motion sensing overlaps Sovol's NOZZLE_CLOG_CHECK heuristic
# (extrusion-without-feeder-pushes). Run both initially; if the Orbiter sensor
# proves reliable, the macro watchdog can be retired.

[neopixel toolhead_leds]
pin: EBBCan:PD3
chain_count: 2
color_order: GRBW
initial_RED: 0.2
initial_GREEN: 0.2
initial_BLUE: 0.2
initial_WHITE: 0.2

[output_pin main_led]
pin: PD13
value: 1.0

[temperature_sensor mainboard_mcu]
sensor_type: temperature_mcu

[temperature_sensor ebb36_mcu]
sensor_type: temperature_mcu
sensor_mcu: EBBCan

[temperature_sensor host]
sensor_type: temperature_host
