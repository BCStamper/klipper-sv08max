# MCUs
########################################

[mcu]                                  # mainboard STM32H750, USB-to-CAN bridge
canbus_uuid: b785e8392e4b              # KNOWN — same physical board as Stage 1, not reflashed for this swap

[mcu EBBCan]                           # new toolhead EBB36 v1.2 (STM32G0B1)
canbus_uuid: 3d42debd8235              # confirmed via canbus_query.py 2026-09-05, running Klipper (Katapult install + CAN flash both succeeded)

[mcu eddy]                             # BTT Eddy Duo. Root cause of its total
canbus_uuid: c16cc3f45744              # canbus_query.py silence all night, found
                                       # 2026-09-06: BTT ships the Eddy Duo's CAN-H/
                                       # CAN-L wire colors REVERSED from their own
                                       # convention (green=H/yellow=L on every other
                                       # BTT board, opposite on the Duo itself).
                                       # Electrically it looked perfect the whole
                                       # time (clean termination, correct resistance)
                                       # because a swapped differential pair is
                                       # invisible to a resistance meter -- it just
                                       # never spoke a valid frame. Swapping the two
                                       # wires fixed it immediately. UUID confirmed
                                       # via canbus_query.py right after. (The
                                       # separate mainboard/EBB36 mystery-CAN-traffic
                                       # investigation from earlier tonight is
                                       # unrelated and still open.)

[printer]
