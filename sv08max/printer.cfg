########################################
# Probe — BTT Eddy Duo via mainline probe_eddy_current, object name `eddy`
# (see the file header for why not eddy-ng, and why this exact object name).
# i2c_mcu/i2c_bus pattern confirmed 2026-08-3x against BTT's own
# bigtreetech/Eddy sample config: a CAN/USB-connected Eddy hosts the LDC1612
# on its OWN onboard MCU, i2c_mcu/i2c_bus point at that MCU's internal bus
# (fixed name i2c0f), NOT software-bitbang pins the way Stage 1's stock coil
# needed (that coil hangs off the toolhead F103's own GPIOs instead).
########################################

# Re-enabled 2026-09-06 once the Eddy Duo's CAN-H/CAN-L swap (see [mcu eddy]
# above) was found and fixed and its real UUID was confirmed via
# canbus_query.py. x_offset/descend_z/tap_z_offset/samples_tolerance etc.
# below are still Stage 1's stock-coil provisional numbers, NOT yet
# recalibrated for this coil — still open per the file header's TODO list
# and doc 04 section G. Don't trust a probe result from this until that's
# done.
[probe_eddy_current eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
descend_z: 2.0
x_offset: 0                            # confirmed 2026-09-06 (Ben): Duo mounted
                                       # directly behind the nozzle, zero X
                                       # displacement, only the caliper-measured
                                       # offset below in Y
y_offset: 26.72
speed: 5
sample_retract_dist: 5.0
samples_tolerance: 0.0095
samples_tolerance_retries: 10
lift_speed: 10                         # added 2026-09-09 after a real shutdown:
                                       # TEMPERATURE_PROBE_CALIBRATE's automatic
                                       # per-sample retrigger (Klipper's own
                                       # internal temperature-watch callback,
                                       # gcode.run_script("TEMPERATURE_PROBE_NEXT")
                                       # with zero params) can never inherit a
                                       # command-line LIFT_SPEED= -- it always
                                       # calls get_probe_params() with gcmd=None,
                                       # which falls back to this config value.
                                       # Without it, every automatic sample used
                                       # the hardcoded 5.0mm/s default, hit the
                                       # same "insufficient lift" tap-detection
                                       # failure as the uncalibrated LIFT_SPEED
                                       # attempts, and -- unlike a directly-typed
                                       # command hitting that same error -- an
                                       # exception inside that internal callback
                                       # isn't caught gracefully and escalates to
                                       # a full klippy shutdown. 10 is the max
                                       # useful value (bed_mesh max_z_velocity: 10
                                       # ceiling) and matches what already worked
                                       # cleanly 6/6 times when passed explicitly.
                                       # NOTE: explicit METHOD=tap commands you
                                       # type yourself still need LIFT_SPEED=10
                                       # passed directly -- that code path reads
                                       # the raw gcmd value only, never this
                                       # config default.
tap_z_offset: 0.0

[temperature_sensor eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy

# Temperature drift compensation — Ben found this 2026-08-3x reading BTT's own
# wiki (global.bttwiki.com/Eddy.html), doc'd there under a "Eddy USB ONLY"
# heading that reads as a real capability gate at a glance. Checked directly
# (GitHub search of bigtreetech/Eddy found zero "Duo" mentions anywhere in
# BTT's own config repo; the wiki itself states "Eddy Duo supports two
# communication methods: USB and CAN" — i.e. USB/CAN are transport choices on
# ONE board, not two different products; independent product listings
# describe temperature compensation as a Duo-vs-Coil feature, not a USB-vs-CAN
# one) — the "USB ONLY" heading is doc-authoring shorthand for "the
# onboard-MCU boards" (Duo) as opposed to bare Eddy Coil (no onboard MCU or
# thermistor at all), not a real CAN-mode exclusion. Sensor lives on the
# Eddy's own onboard MCU regardless of which transport is wired up. Genuinely
# useful here: this compensates for thermal expansion of the machine's own
# mechanical components, not just probe drift, and that effect scales with
# bed size — worth having on a bed this large. Calibrate via
# `SET_IDLE_TIMEOUT TIMEOUT=36000` then
# `TEMPERATURE_PROBE_CALIBRATE PROBE=eddy TARGET=56 STEP=4` (bed AND nozzle
# both hot throughout, per BTT's own doc — calibrating with only one hot
# leaves a systematic ~0.05mm gap later). Object name matches
# `[probe_eddy_current eddy]` above, matching Klipper's own linking
# convention for this feature.
[temperature_probe eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2
calibration_bed_temp: 100              # added 2026-09-09: without this,
                                       # TEMPERATURE_PROBE_CALIBRATE's one-shot
                                       # post-sample-1 _set_bed_temp() call is a
                                       # silent no-op (cal_bed_temp defaults to
                                       # None), leaving the bed at whatever it
                                       # was and requiring a manual
                                       # SET_HEATER_TEMPERATURE for the probe to
                                       # ever heat-soak toward TARGET. 100C is
                                       # comfortably under typical PEI limits and
                                       # should reliably drive the coil up near
                                       # a TARGET=75 probe temp over the soak.
calibration_extruder_temp: 220         # one-time push during _move_to_start(),
                                       # before sampling begins -- BTT's own
                                       # docs: calibrating with only bed OR
                                       # nozzle hot (not both) leaves a
                                       # systematic ~0.05mm gap later if you
                                       # then print with both hot. 220C is a
                                       # normal PETG nozzle temp, not an extreme
                                       # unattended hold.

[bed_mesh]
speed: 200                             # halved from 400 on 2026-09-09: DKEU's
                                       # BED_MESH_CALIBRATE override always uses
                                       # METHOD=rapid_scan on this probe, so this
                                       # speed IS the eddy scan's own traverse rate
                                       # (continuous-sample scanning, not discrete
                                       # probe-and-retract) -- slower gives the
                                       # LDC1612 more dwell time per unit of travel.
                                       # Measured cost: adaptive meshes were
                                       # completing in ~45-60s at 400; expect
                                       # roughly double, still trivial against a
                                       # multi-hour print.
horizontal_move_z: 2
algorithm: bicubic
mesh_min: 13,28                        # RECOMPUTED 2026-09-06 now that x/y_offset are
mesh_max: 476,490                      # real: mesh_point must satisfy position_min +
                                       # offset <= point <= position_max + offset (BTT's
                                       # own sample config formula). X unaffected
                                       # (x_offset 0, same as stock's near-zero -19.8 in
                                       # this direction -- ceiling stays 502, nowhere
                                       # near stock's already-chosen 476) so X bounds
                                       # carry over unchanged. Y-min DID need to move:
                                       # this coil's much larger +26.72 y_offset (vs
                                       # stock's -0.75) raises the floor from stock's 15
                                       # to position_min(-1)+26.72=25.72 -- 15 is no
                                       # longer physically reachable (would need the
                                       # toolhead at Y=-11.72, past position_min).
                                       # Rounded up to 28 for ~2.3mm margin over the
                                       # bare floor (y_offset is a caliper measurement,
                                       # not exact). Y-max unaffected, still well inside
                                       # its new (more permissive) ceiling of 531.72 --
                                       # 490 was always bed-edge-limited, not
                                       # offset-limited. Worst case if still off: a
                                       # BED_MESH_CALIBRATE error that a point is
                                       # unreachable, not anything unsafe.
probe_count: 60,60
fade_start: 0
fade_end: 10
scan_overshoot: 4

[quad_gantry_level]
gantry_corners:                        # same physical frame/gantry as Stage 1 — these
	-70,-40                        # are frame-geometry, not toolhead-geometry, so
	550,600                        # they carry forward unchanged
points:                                # VERIFIED 2026-09-06 with real offsets (0,
    50, 30                             # 26.72): toolhead target = point - offset, so
    50, 470                            # e.g. (50,30) actually probes at toolhead
    490, 470                           # (50, 3.28) -- all 4 corners land comfortably
    490, 30                            # inside position_min/max on both axes, nowhere
                                       # near a limit. No change needed, as predicted.
speed: 400
horizontal_move_z: 3                   # Stage 1's proven-safe starting value (its
                                       # eddy-range ceiling forced this same number
                                       # across several independent macros) — verify
                                       # against this coil's own calibrated range
                                       # once 04-G.2 is done, don't assume unchanged
retry_tolerance: 0.1
retries: 15
max_adjust: 20

########################################
# Accelerometer + input shaper — onboard ADXL345 (EBB36), replacing Stage 1's
# separate LIS2DW on the stock toolhead
########################################

[adxl345]
cs_pin: EBBCan:PB12
spi_bus: spi2_PB2_PB11_PB10            # FIX (2026-09-05): bare "spi2" defaults to a pin
                                       # mapping that includes PB13 as its clock line,
                                       # which collides with the extruder's heater_pin
                                       # (also PB13, and correct — confirmed against
                                       # Klipper's own official sample config for this
                                       # board) — halted the printer on first boot
                                       # ("pin PB13 is reserved for spi2"). This named
                                       # alternate mapping is the board's intended
                                       # workaround, confirmed against that same
                                       # official Klipper sample config.
axes_map: x,y,z                       # TODO (04-E): verify via MEASURE_AXES_NOISE /
                                       # shake test after mounting — don't assume this
                                       # matches the old stock-toolhead LIS2DW mapping
                                       # (x,z,y), it's a different chip on a different
                                       # mount orientation

[resonance_tester]
accel_chip: adxl345
probe_points:
    250, 250, 30

# [input_shaper] — leave unset; run SHAPER_CALIBRATE after 04-I.3

########################################
# LEDs + toolhead filament sensing
########################################

[neopixel toolhead_leds]
pin: EBBCan:PD3
chain_count: 2                         # this toolhead has 2 chained NeoPixels the
                                       # stock one didn't — re-run DKEU's Heat_Soak
                                       # installer step and pick option 3
                                       # (Heat_Soak_Toolhead_LEDs.cfg) once this
                                       # deploys, and flip demon_user_settings'
                                       # variable_neopixel_led to True
color_order: GRBW
initial_RED: 0.2
initial_GREEN: 0.2
initial_BLUE: 0.2
initial_WHITE: 0.2

# Orbiter Smart Sensor (presence + tangle detection) — wired in 2026-09-08
# per 04-ORBITER-SMART-SENSOR.md's own follow-up plan, prompted by a real
# save: a full spool's weight put tension on the line overnight (no buffer
# to absorb it anymore), the sensor's own RGB ring caught it (yellow) before
# it became a real jam, Ben happened to notice and fixed it by hand. This
# wiring is what makes that automatic instead of relying on someone walking
# by. DELIBERATELY takes only the two raw pin declarations, NOT the
# sensor's bundled PAUSE/RESUME/CANCEL_PRINT/filament-change macro pack —
# that collides with DKEU the same way every other competing macro pack on
# this project has. runout_gcode/press_gcode below call into the existing,
# already-fixed M600 -> PAUSE -> _DEMON_PAUSE chain instead (confirmed live
# 2026-09-08: DKEU's own [gcode_macro M600] in demon_core_assets_v2.3.7.cfg
# still ultimately calls PAUSE, which client.cfg/My_Macros.cfg's
# _CLIENT_VARIABLE correctly routes to _DEMON_PAUSE -- verified against the
# live file, not assumed).
#
# First real deploy 2026-09-08 (post-print, part still cooling on the bed)
# immediately surfaced a real bug: [gcode_button filament_unload]'s
# press_gcode fired PAUSE on its own right after klipper connected, with
# nobody touching anything. Confirmed physically safe -- PAUSE's own park
# move was rejected by Klipper's own "Must home axis first" check before
# any step was ever generated, zero motion, part undisturbed -- but a false
# trigger is still a real bug. Ben's diagnosis, confirmed plausible: the
# sensor's onboard ATtiny412 goes through its own boot sequence on power-up
# and can put a transient signal on its pins before it settles into real
# driven output; the button had no pull direction specified and no
# time-based guard, so Klipper read that transient as a press. The FS
# (presence) line didn't misfire this same time, but it's driven by the
# same onboard MCU, so it's gated by the same guard below for symmetry
# rather than trusting it just because it happened not to glitch this once.
# Fix: an armed flag that only goes True a few seconds after klippy
# connects, giving the sensor's own MCU time to finish booting before
# either handler is allowed to actually do anything. A pull resistor
# wouldn't have fixed this specific failure mode -- the sensor is actively
# driving the pin during its own boot, not leaving it floating -- so a
# time delay is the correct fix, not a pin-modifier guess.
[gcode_macro _FILAMENT_SENSOR_VARS]
variable_armed: False
variable_tangle_enabled: True          # added 2026-09-09: independent of `armed`
                                       # (which is purely the boot-transient gate
                                       # below, applies to both sensors equally).
                                       # This one lets the tangle/tension trip
                                       # specifically be disabled mid-print (long
                                       # PTFE runs have tripped it too easily) while
                                       # leaving O2_sensor's own runout detection
                                       # fully active -- previously both shared the
                                       # single `armed` flag, so disabling one always
                                       # silently disabled the other too. Resets to
                                       # True at the start of every print via
                                       # _CUSTOM_PRE_PRINT (demon_custom_expansion) --
                                       # a mid-print DISABLE_TANGLE_SENSOR never
                                       # silently carries into the next print.
gcode:

[delayed_gcode _ARM_FILAMENT_SENSORS]
initial_duration: 5                    # ATtiny412 boot is normally well under 1s;
                                       # this is a comfortable margin, not a tuned
                                       # value -- lengthen if a future restart still
                                       # shows a false trigger inside this window
gcode:
    SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSOR_VARS VARIABLE=armed VALUE=True

[gcode_macro DISABLE_TANGLE_SENSOR]
gcode:
    SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSOR_VARS VARIABLE=tangle_enabled VALUE=False
    RESPOND TYPE=COMMAND MSG="Tangle/tension sensor disabled for the rest of this print -- O2_sensor runout detection is unaffected. Resets automatically at the next print's start."

[gcode_macro ENABLE_TANGLE_SENSOR]
gcode:
    SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSOR_VARS VARIABLE=tangle_enabled VALUE=True
    RESPOND TYPE=COMMAND MSG="Tangle/tension sensor re-enabled."

[filament_switch_sensor O2_sensor]
switch_pin: !EBBCan:PB4                # FS -- presence/runout. Inverted 2026-09-09:
                                       # confirmed live via QUERY_FILAMENT_SENSOR that
                                       # this pin read filament_detected=false while
                                       # filament was genuinely loaded (LED ring green) --
                                       # same inverted-pin bug class as the X-endstop.
                                       # Caused a mid-print false-runout pause; worked
                                       # around live with SET_FILAMENT_SENSOR ENABLE=0
                                       # (no restart, print was active) until this fix
                                       # could be deployed safely post-print.
pause_on_runout: False                 # explicit: runout_gcode below is the one true
                                       # response, avoid the built-in default AND our
                                       # own gcode both firing
runout_gcode:
    {% if printer["gcode_macro _FILAMENT_SENSOR_VARS"].armed == True %}
    M600                               # already-correct chain per the header note above
    {% endif %}

[gcode_button filament_unload]
pin: EBBCan:PB3                        # FTU -- tangle/tension trip (name is the
                                       # sensor's own upstream convention, not
                                       # descriptive of what we actually do with it)
press_gcode:
    {% if printer["gcode_macro _FILAMENT_SENSOR_VARS"].armed == True and printer["gcode_macro _FILAMENT_SENSOR_VARS"].tangle_enabled == True %}
    PAUSE                              # stop immediately, let Ben physically clear the
                                       # tangle by hand -- deliberately NOT an automated
                                       # unload attempt, which could grind/snap filament
                                       # against whatever's actually causing the tangle
    {% endif %}

