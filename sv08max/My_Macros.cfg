# _CLIENT_VARIABLE override for mainsail-config's client.cfg, per DKEU's own
# Set_Up_Your_Mainsail.cfg.md doc. client.cfg is read-only (git-managed), so
# this lives in its own file and gets included after it in printer.cfg.
# Added 2026-08-19 after the v3.2.2 reinstall -- client.cfg's PAUSE/RESUME/
# CANCEL_PRINT are the active ones (loaded after DKEU's core), and this is
# what wires them to actually call _DEMON_PAUSE/_DEMON_RESUME/_DEMON_CANCEL
# instead of silently no-op'ing (client.cfg defaults all three to "").

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True    ; matches macros.cfg's old validated pause_park (2026-08-03 fix: clears both endstops, avoids the 20mm axis_backoff_distance margin)
variable_custom_park_x    : 10.0
variable_custom_park_y    : 10.0
variable_custom_park_dz   : 2.0
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : False
variable_park_at_cancel_x : None
variable_park_at_cancel_y : None
variable_use_fw_retract   : True    ; [firmware_retraction] added to printer.cfg 2026-08-19, DKEU post-install checklist
variable_idle_timeout     : 600
variable_runout_sensor    : ""      ; no filament_switch_sensor active -- buffer-synced.cfg (which used to define it) is disabled; Orbiter sensor install is still pending
variable_user_pause_macro : "_DEMON_PAUSE"
variable_user_resume_macro: "_DEMON_RESUME"
variable_user_cancel_macro: "_DEMON_CANCEL"
gcode:
