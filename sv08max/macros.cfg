# SV08 MAX mainline — compatibility macro layer (master-tracking branch)
# Shared macros for the feeder contract, runout tail-consumption, and
# feeder-aware PAUSE/RESUME/CANCEL. Buffer-variant-specific macros
# (UNLOAD_FILAMENT, MANUAL_FEED, FEED_LOOP, jam/clog checks) live in
# buffer-synced.cfg / buffer-pushed.cfg. PLR lives in plr.cfg.
# NOTE: if you install mainsail-config's client.cfg, its PAUSE/RESUME/CANCEL
# macros conflict with these — keep one set only (keep these; they are feeder-aware).

[gcode_macro _global_var]
# pause/cancel park fixed 2026-08-03: previous values (x:-2,y:-0.5 / x:-2,y:501)
# sat inside DKEU's own 20mm axis_backoff_distance safety margin from the Y
# endstop (position_min:-1) -- pause_park's y:-0.5 was effectively ON it,
# meaning a G28 right after a pause reliably found the endstop already
# triggered. New values chosen for front-of-bed access (avoid reaching to the
# back) while clearing both endstops.
variable_pause_park: {'x': 10, 'y': 10, 'z': 10, 'e': 1}
variable_cancel_park: {'x': 10, 'y': 490, 'z': 10, 'e': 1}
variable_z_maximum_lifting_distance: 502
variable_pause_resume_travel_speed: 150
variable_load_filament_extruder_temp: 250
variable_is_push_buffer: True
gcode:

# Feeder state flags — read by the touchscreen/UI via Moonraker (name is a contract)
[gcode_macro variables]
variable_stop_feeding: False
variable_is_manual_feeding: False
variable_plug_status: False
variable_winding_status: False
variable_clog_retry: False
# Added 2026-08-17 for buffer_clog_check's filament_used-delta guard --
# delayed_gcode sections don't support variable_* options (only gcode_macro
# does), so this lives here instead, matching how every other buffer-synced.cfg
# state flag (stop_feeding, winding_status, etc.) is already stored on this
# same shared object.
variable_clog_check_start_extrusion: 0
gcode:

[gcode_macro mainled_on]
gcode:
    SET_PIN PIN=main_led VALUE=1

[gcode_macro mainled_off]
gcode:
    SET_PIN PIN=main_led VALUE=0

########################################
# Runout tail-consumption chain
########################################

[gcode_macro CONTINUE_PRINT_D]
variable_end_d: 0
gcode:
    {% set d_start = printer.print_stats.filament_used|float %}
    {% set d_end = (d_start + params.D|float)|float %}
    SET_GCODE_VARIABLE MACRO=CONTINUE_PRINT_D VARIABLE=end_d VALUE={d_end}
    UPDATE_DELAYED_GCODE ID=VERIFY_PRINT_D DURATION=1

[delayed_gcode VERIFY_PRINT_D]
initial_duration: 0
gcode:
    {% if printer.print_stats.state == "printing" and printer['filament_switch_sensor filament_sensor'].filament_detected != True %}
        {% set d_current = printer.print_stats.filament_used|float %}
        {% if d_current < printer["gcode_macro CONTINUE_PRINT_D"].end_d %}
            UPDATE_DELAYED_GCODE ID=VERIFY_PRINT_D DURATION=1
        {% else %}
            M600
            UPDATE_DELAYED_GCODE ID=VERIFY_PRINT_D DURATION=0
        {% endif %}
    {% else %}
        UPDATE_DELAYED_GCODE ID=VERIFY_PRINT_D DURATION=0
    {% endif %}

[gcode_macro M600]
gcode:
    PAUSE STATE=filament_change
    {action_respond_info("filament change")}

########################################
# Load / unload
########################################

# Fixed 2026-08-03: this macro's own ~75mm net forward extrusion (E45+E30) had
# nothing wrapping it, the same gap that let UNLOAD_FILAMENT's ~65mm net
# retraction grind filament in the buffer gears -- same spring-joint travel
# limit, same fix. Rebuilt onto _BUFFER_MOVE 2026-08-18, twice the same night
# (buffer-synced.cfg's stepper moved off extruder_stepper/FORCE_MOVE, then
# off manual_stepper's own MOVE= interface onto a registered gcode axis --
# see that file's header for why); each G1 E line gets a matching
# _BUFFER_MOVE right after it, same chunking the F-coded moves already used.
# The trailing M400 is what actually waits for the queued U moves to
# complete now (G1-based moves are lookahead-queued, not blocking) -- only
# runs while not printing (guarded below) so that wait costs nothing here.
[gcode_macro LOAD_FILAMENT]
gcode:
    {% set extruder_temp = printer['gcode_macro _global_var'].load_filament_extruder_temp|int %}
    {% set current_target_temp = printer.extruder.target|int %}
    MANUAL_FEED
    {% if printer.print_stats.state != "printing" %}
        {% if printer.print_stats.state != "paused" or current_target_temp == 0 %}
            M109 S{extruder_temp}
        {% else %}
            {% if current_target_temp >= printer.configfile.settings['extruder'].min_extrude_temp %}
                M109 S{current_target_temp}
            {% else %}
                M109 S{extruder_temp}
            {% endif %}
        {% endif %}
        G91
        G1 E45 F300
        _BUFFER_MOVE DELTA=45 SPEED=5
        G1 E30 F150
        _BUFFER_MOVE DELTA=30 SPEED=2.5
        G90
        M400
    {% else %}
        {action_respond_info("Don't load filament during printing!!!")}
    {% endif %}

[gcode_macro _CONTINUE_LOAD_FILAMENT]
gcode:
    {% if printer.extruder.temperature >= printer.configfile.settings['extruder'].min_extrude_temp %}
        G91
        G1 E10.0 F300
        M400
        G90
    {% else %}
        {action_respond_info("Nozzle not hot enough!")}
    {% endif %}

########################################
# Feeder-aware PAUSE / RESUME / CANCEL
# (UNLOAD_FILAMENT / BUFFER_LONG_UNLOAD_FILAMENT come from the buffer variant)
########################################

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
    {% set park = printer['gcode_macro _global_var'].pause_park %}
    {% set state = params.STATE|default('normal') %}
    {% if printer.print_stats.state == "printing" %}
        PAUSE_BASE
        G91
        {% if printer.extruder.temperature >= printer.configfile.settings['extruder'].min_extrude_temp %}
            G1 E-{park.e} F300
        {% endif %}
        {% if (printer.toolhead.position.z + 10) < printer['gcode_macro _global_var'].z_maximum_lifting_distance %}
            G1 Z10 F600
        {% endif %}
        G90
        G1 X{park.x} Y{park.y} F{printer['gcode_macro _global_var'].pause_resume_travel_speed * 60}
        {% if state == 'filament_change' %}
            {% if printer['filament_switch_sensor filament_sensor'].filament_detected == True %}
                BUFFER_LONG_UNLOAD_FILAMENT
            {% else %}
                UNLOAD_FILAMENT
            {% endif %}
            M400
        {% endif %}
    {% endif %}

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
    {% set park = printer['gcode_macro _global_var'].pause_park %}
    MANUAL_FEED
    {% if printer['filament_switch_sensor filament_sensor'].filament_detected != True %}
        {action_respond_info("Please insert filament in sensor!")}
    {% else %}
        {% if printer.extruder.temperature >= printer.configfile.settings['extruder'].min_extrude_temp %}
            G91
            G1 E{park.e} F300
            G90
        {% endif %}
        RESUME_BASE
        SET_PIN PIN=green_led VALUE=1
        SET_PIN PIN=red_led VALUE=0
        SET_PIN PIN=blue_led VALUE=0
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=plug_status VALUE=False
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=winding_status VALUE=False
        M400
    {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set park = printer['gcode_macro _global_var'].cancel_park %}
    # cancel is a deliberate end: stop PLR journal and clear the interrupted flag
    UPDATE_DELAYED_GCODE ID=plr_journal DURATION=0
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
    # BUFFER_DESYNC call removed 2026-08-18: the macro itself no longer exists
    # -- buffer-synced.cfg moved off extruder_stepper/SYNC_EXTRUDER_MOTION onto
    # [manual_stepper] entirely (see that file's header). This guard would
    # have safely no-op'd (same "is defined" pattern that already caused one
    # regression this project when a guarded macro got restored later --
    # better to just delete now that it's genuinely gone for good).
    TURN_OFF_HEATERS
    M106 S0
    {% if printer.toolhead.homed_axes == "xyz" %}
        G91
        {% if (printer.toolhead.position.z + 10) < printer['gcode_macro _global_var'].z_maximum_lifting_distance %}
            G1 Z10 F600
        {% endif %}
        G90
        G1 X{park.x} Y{park.y} F{printer['gcode_macro _global_var'].pause_resume_travel_speed * 60}
    {% endif %}
    CANCEL_PRINT_BASE

########################################
# Fast temperature-wait wrappers (stock behavior)
########################################

[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|float %}
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-1} MAXIMUM={s+2}
    {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:
    {% set s = params.S|float %}
    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-1} MAXIMUM={s+2}
    {% endif %}
